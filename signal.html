<h2>Signals</h2>

<div id="data"></div>

<script>
fetch("http://localhost:5000/api/signals")
.then(r=>r.json())
.then(data=>{
  data.forEach(s=>{
    document.getElementById("data").innerHTML += `
      <div style="border:1px solid #ccc;padding:10px;margin:10px">
        <h3>${s.pair}</h3>
        <p>${s.type}</p>
        <p>Entry: ${s.entry}</p>
        <a href="details.html?id=${s.id}">View</a>
      </div>
    `;
  });
});
</script>
