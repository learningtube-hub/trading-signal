<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Magic Trade AI</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0f1a;
  color:white;
}

/* TOP BAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 20px;
  background:#0f172a;
  border-bottom:1px solid #1f2937;
}

.logo{
  font-size:18px;
  font-weight:bold;
  color:#00ffcc;
}

/* NEWS BAR */
.newsbar{
  display:flex;
  align-items:center;
  background:#0b1220;
  padding:10px 15px;
  border-bottom:1px solid #1f2937;
  overflow:hidden;
}

.newsicon{margin-right:10px;font-size:20px;}
.newslabel{
  font-weight:bold;
  color:#00ffcc;
  margin-right:15px;
}

.marquee{
  white-space:nowrap;
  overflow:hidden;
  flex:1;
}

.marquee span{
  display:inline-block;
  padding-left:100%;
  animation: scroll 20s linear infinite;
}

@keyframes scroll{
  0% {transform:translateX(0);}
  100% {transform:translateX(-100%);}
}

/* LAYOUT */
.container{
  display:flex;
  height:100vh;
}

/* LEFT */
.left{
  width:240px;
  background:#0f172a;
  padding:10px;
  border-right:1px solid #1f2937;
}

.pair{
  padding:10px;
  margin:6px 0;
  background:#1e293b;
  cursor:pointer;
  border-radius:6px;
}

/* CENTER */
.center{
  flex:1;
  padding:10px;
}

/* RIGHT */
.right{
  width:320px;
  background:#0f172a;
  padding:10px;
  border-left:1px solid #1f2937;
}

.card{
  background:#111827;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
}

.buy{color:#00ff88;font-weight:bold;}
.sell{color:#ff4d4d;font-weight:bold;}

.status{
  padding:6px;
  background:orange;
  display:inline-block;
  border-radius:5px;
}

button{
  padding:8px;
  margin-top:5px;
  cursor:pointer;
  border:none;
  border-radius:5px;
  background:#2563eb;
  color:white;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">⚡ MAGIC TRADE AI</div>
  <div>
    <button onclick="alert('Login system later')">Login</button>
    <button onclick="alert('Register system later')">Register</button>
  </div>
</div>

<!-- NEWS BAR -->
<div class="newsbar">
  <div class="newsicon">🧠</div>
  <div class="newslabel">UPDATE NEWS</div>

  <div class="marquee">
    <span id="newsText">
      BTC showing volatility | ETH breakout incoming | Institutional flow detected | Market reacting to global news |
    </span>
  </div>
</div>

<div class="container">

<!-- LEFT -->
<div class="left">
<h3>MARKETS</h3>

<div class="pair" onclick="setPair('BTCUSDT')">BTCUSDT</div>
<div class="pair" onclick="setPair('ETHUSDT')">ETHUSDT</div>
<div class="pair" onclick="setPair('BNBUSDT')">BNBUSDT</div>

<hr>

<div class="card">
<p id="plan">FREE USER</p>
<button onclick="upgrade()">Upgrade PRO</button>
</div>

</div>

<!-- CENTER -->
<div class="center">
<div id="chart"></div>
</div>

<!-- RIGHT -->
<div class="right">

<div class="card">
<div class="status" id="status">WAITING FOR SIGNAL</div>
</div>

<div class="card">
<div id="signal">Signal: -</div>
<div id="rsi">RSI: -</div>
</div>

<button onclick="generateSignal()">SCAN MARKET</button>

</div>

</div>

<script>

let pair="BTCUSDT";
let prices=[];
let plan="FREE";

// chart
function loadChart(symbol){
  new TradingView.widget({
    "container_id":"chart",
    "width":"100%",
    "height":720,
    "symbol":"BINANCE:"+symbol,
    "interval":"30",
    "theme":"dark"
  });
}

// change pair
function setPair(p){
  pair=p;
  prices=[];
  loadChart(pair);
}

// price
async function getPrice(){
  let res=await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${pair}`);
  let data=await res.json();
  return parseFloat(data.price);
}

// RSI
function RSI(arr){
  if(arr.length<14) return 50;
  let g=0,l=0;
  for(let i=arr.length-14;i<arr.length;i++){
    let d=arr[i]-arr[i-1];
    if(d>0)g+=d; else l+=Math.abs(d);
  }
  let rs=g/(l||1);
  return 100-(100/(1+rs));
}

// signal
function signal(rsi){
  if(rsi<30) return "LONG";
  if(rsi>70) return "SHORT";
  return "WAIT";
}

// main
async function generateSignal(){
  let price=await getPrice();
  prices.push(price);
  if(prices.length>50) prices.shift();

  let rsi=RSI(prices);
  let sig=signal(rsi);

  document.getElementById("rsi").innerText="RSI: "+rsi.toFixed(2);

  if(sig==="LONG"){
    document.getElementById("signal").innerHTML="<span class='buy'>LONG</span>";
    document.getElementById("status").innerText="BUY ZONE";
  }
  else if(sig==="SHORT"){
    document.getElementById("signal").innerHTML="<span class='sell'>SHORT</span>";
    document.getElementById("status").innerText="SELL ZONE";
  }
  else{
    document.getElementById("signal").innerText="WAIT";
    document.getElementById("status").innerText="NO TRADE";
  }
}

// upgrade
function upgrade(){
  plan="PRO";
  document.getElementById("plan").innerText="PRO USER 🔥";
}

// news auto rotate
const news=[
 "BTC volatility increasing",
 "ETH breakout watch",
 "Institutional buying BTC",
 "Market liquidity shift",
 "Global crypto news impact"
];

let i=0;
setInterval(()=>{
  document.getElementById("newsText").innerText=
  news[i]+" | "+news[(i+1)%news.length]+" | "+news[(i+2)%news.length];
  i++;
  if(i>=news.length) i=0;
},5000);

loadChart(pair);

</script>

</body>
</html>
