<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OVERLAY TRADING SIGNAL UI</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
height:100vh;
overflow:hidden;
}

/* WRAPPER */
#chartWrapper{
position:relative;
width:100%;
height:100vh;
}

/* TRADINGVIEW */
#chart{
width:100%;
height:100%;
}

/* OVERLAY PANEL */
.overlay{
position:absolute;
top:15px;
left:15px;
width:280px;
background:rgba(17,24,39,0.92);
border-radius:12px;
padding:12px;
z-index:10;
box-shadow:0 0 20px rgba(0,0,0,0.6);
}

/* SIGNAL BOX */
.signal{
text-align:center;
padding:12px;
border-radius:10px;
font-size:20px;
font-weight:bold;
margin-bottom:10px;
}

.buy{background:#16a34a;}
.sell{background:#dc2626;}
.wait{background:#facc15;color:black;}

/* INFO ROW */
.row{
display:flex;
justify-content:space-between;
margin:6px 0;
font-size:14px;
}

/* TP SL */
.tp{color:#22c55e;font-weight:bold;}
.sl{color:#ef4444;font-weight:bold;}

</style>
</head>

<body>

<div id="chartWrapper">

<!-- OVERLAY UI -->
<div class="overlay">

<div id="signalBox" class="signal wait">WAIT</div>

<div class="row">
<span>Entry</span>
<span id="entry">--</span>
</div>

<div class="row">
<span>TP</span>
<span id="tp" class="tp">--</span>
</div>

<div class="row">
<span>SL</span>
<span id="sl" class="sl">--</span>
</div>

<div class="row">
<span>RSI (4H)</span>
<span id="rsi">--</span>
</div>

</div>

<!-- CHART -->
<div id="chart"></div>

</div>

<script>

let symbol="BINANCE:BTCUSDT";

// ---------------- CHART ----------------
function loadChart(){
new TradingView.widget({
container_id:"chart",
width:"100%",
height:"100%",
symbol:symbol,
interval:"30",
theme:"dark",
style:"1"
});
}

// ---------------- DATA ----------------
async function getCloses(tf){
let res=await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol.replace("BINANCE:","")}&interval=${tf}&limit=50`);
let data=await res.json();
return data.map(x=>parseFloat(x[4]));
}

// ---------------- RSI ----------------
function calcRSI(closes){
let gain=0,loss=0;

for(let i=1;i<closes.length;i++){
let diff=closes[i]-closes[i-1];
if(diff>0) gain+=diff;
else loss+=Math.abs(diff);
}

let rs=gain/(loss||1);
return 100-(100/(1+rs));
}

// ---------------- SIGNAL ----------------
function getSignal(rsi){
if(rsi<35) return "BUY";
if(rsi>65) return "SELL";
return "WAIT";
}

// ---------------- OVERLAY UPDATE ----------------
function updateUI(signal,price,rsi){

let box=document.getElementById("signalBox");

box.className="signal";

if(signal=="BUY"){
box.classList.add("buy");
box.innerText="🟢 BUY SIGNAL";
}

else if(signal=="SELL"){
box.classList.add("sell");
box.innerText="🔴 SELL SIGNAL";
}

else{
box.classList.add("wait");
box.innerText="🟡 WAIT";
}

// ENTRY
document.getElementById("entry").innerText=price.toFixed(2);

// TP / SL
if(signal=="BUY"){
document.getElementById("tp").innerText=(price*1.02).toFixed(2);
document.getElementById("sl").innerText=(price*0.99).toFixed(2);
}

else if(signal=="SELL"){
document.getElementById("tp").innerText=(price*0.98).toFixed(2);
document.getElementById("sl").innerText=(price*1.01).toFixed(2);
}

else{
document.getElementById("tp").innerText="--";
document.getElementById("sl").innerText="--";
}

document.getElementById("rsi").innerText=rsi.toFixed(2);
}

// ---------------- MAIN LOOP ----------------
async function update(){

let c4h=await getCloses("4h");
let price=c4h[c4h.length-1];

let rsi=calcRSI(c4h);
let signal=getSignal(rsi);

updateUI(signal,price,rsi);

}

// INIT
loadChart();
setInterval(update,10000);

</script>

</body>
</html>
