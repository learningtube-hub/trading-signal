<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LIGHT SIGNAL SYSTEM v2</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
display:flex;
height:100vh;
}

.left{
width:220px;
background:#111827;
padding:10px;
}

.center{
flex:1;
display:flex;
flex-direction:column;
}

.right{
width:340px;
background:#111827;
padding:10px;
overflow:auto;
}

.box{
background:#1f2937;
padding:10px;
margin:8px 0;
border-radius:10px;
}

.rsiBox{
display:flex;
justify-content:space-between;
padding:8px;
margin:6px 0;
background:#111827;
border-radius:8px;
}

/* LIGHT STYLE */
.light{
width:18px;
height:18px;
border-radius:50%;
display:inline-block;
margin-right:8px;
background:#555;
}

.green{background:#22c55e; animation:blink 1s infinite;}
.red{background:#ef4444; animation:blink 1s infinite;}
.yellow{background:#facc15; animation:blink 1s infinite;}

@keyframes blink{
50%{opacity:0.3;}
}
</style>
</head>

<body>

<!-- LEFT -->
<div class="left">
<h3>MARKET</h3>
<div class="box">BTC</div>
<div class="box">ETH</div>
<div class="box">SOL</div>
</div>

<!-- CENTER -->
<div class="center">
<div id="chart"></div>
</div>

<!-- RIGHT -->
<div class="right">

<h3>RSI STATUS</h3>

<div class="rsiBox">30M <span id="r30">--</span></div>
<div class="rsiBox">1H <span id="r1h">--</span></div>
<div class="rsiBox">4H <span id="r4h">--</span></div>
<div class="rsiBox">1D <span id="r1d">--</span></div>

<hr>

<h3>SIGNAL LIGHT</h3>

<div class="box">
<span id="light" class="light"></span>
<span id="signalText">WAIT</span>
</div>

</div>

<script>

let symbol="BINANCE:BTCUSDT";

// ---------------- CHART ----------------
function loadChart(sym){
document.getElementById("chart").innerHTML="";
new TradingView.widget({
container_id:"chart",
width:"100%",
height:"100%",
symbol:sym,
interval:"30",
theme:"dark",
style:"1"
});
}

// ---------------- RSI ----------------
async function getCloses(tf){
let res=await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol.replace("BINANCE:","")}&interval=${tf}&limit=50`);
let data=await res.json();
return data.map(x=>parseFloat(x[4]));
}

function calcRSI(closes){
let gain=0,loss=0;

for(let i=1;i<closes.length;i++){
let diff=closes[i]-closes[i-1];
if(diff>0) gain+=diff;
else loss+=Math.abs(diff);
}

let rs=gain/(loss||1);
return 100-(100/(1+rs));
}

// ---------------- SIGNAL ENGINE ----------------
function getSignal(rsi){
if(rsi<30) return "GREEN";   // BUY
if(rsi>70) return "RED";     // SELL
return "YELLOW";             // NEUTRAL
}

function updateLight(signal,rsi4h){

let light=document.getElementById("light");
let text=document.getElementById("signalText");

// reset
light.className="light";

if(signal=="GREEN"){
light.classList.add("green");
text.innerText="BUY SIGNAL";
}
else if(signal=="RED"){
light.classList.add("red");
text.innerText="SELL SIGNAL";
}
else{
light.classList.add("yellow");
text.innerText="NEUTRAL";
}

}

// ---------------- UPDATE ----------------
async function update(){

let c30=await getCloses("30m");
let c1h=await getCloses("1h");
let c4h=await getCloses("4h");
let c1d=await getCloses("1d");

let r30=calcRSI(c30);
let r1h=calcRSI(c1h);
let r4h=calcRSI(c4h);
let r1d=calcRSI(c1d);

// RSI UI
document.getElementById("r30").innerText=r30.toFixed(2);
document.getElementById("r1h").innerText=r1h.toFixed(2);
document.getElementById("r4h").innerText=r4h.toFixed(2);
document.getElementById("r1d").innerText=r1d.toFixed(2);

// MAIN SIGNAL (4H BASED)
let signal=getSignal(r4h);

// LIGHT UPDATE
updateLight(signal,r4h);

}

// INIT
loadChart(symbol);
setInterval(update,10000);

</script>

</body>
</html>
