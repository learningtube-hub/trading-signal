<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MULTI TF RSI SIGNAL BOT (FIXED NEUTRAL BLINK)</title>
<script src="https://s3.tradingview.com/tv.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#0b1220;color:#e5e7eb;height:100vh;display:flex;overflow:hidden;}

.left{width:180px;background:#0f172a;border-right:1px solid #1f2937;padding:10px;}
.pair{padding:10px;margin:6px 0;background:#111827;border-radius:8px;text-align:center;cursor:pointer;}

.center{flex:1;display:flex;flex-direction:column;}
.topbar{height:50px;background:#0f172a;border-bottom:1px solid #1f2937;display:flex;justify-content:space-between;align-items:center;padding:0 10px;}
.chartBox{flex:1;margin:8px;border-radius:12px;overflow:hidden;border:1px solid #1f2937;}

.right{width:380px;background:#0f172a;border-left:1px solid #1f2937;padding:10px;overflow:auto;}

.card{background:#111827;padding:12px;border-radius:12px;margin-bottom:10px;}

.signalBox{padding:12px;border-radius:12px;text-align:center;font-size:18px;font-weight:bold;}
.green{background:#16a34a;color:#fff;}
.red{background:#dc2626;color:#fff;}
.yellow{background:#f59e0b;color:#000;}

.small{font-size:12px;opacity:0.85;margin-top:4px;}

.tfGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
.tfBox{background:#0b1220;padding:10px;border-radius:10px;font-size:12px;}

/* 🔥 NEUTRAL BLINK EFFECT */
.neutralBlink{
  animation: blink 1s infinite;
  border:1px solid #fbbf24;
}

@keyframes blink{
  0%{opacity:1;}
  50%{opacity:0.4;}
  100%{opacity:1;}
}

</style>
</head>

<body>

<div class="left">
<h3>MARKET</h3>
<div class="pair" onclick="setSymbol('BTCUSDT')">BTC</div>
<div class="pair" onclick="setSymbol('ETHUSDT')">ETH</div>
<div class="pair" onclick="setSymbol('SOLUSDT')">SOL</div>
</div>

<div class="center">
<div class="topbar">
<div id="title">MULTI TF RSI BOT</div>
<div id="price">PRICE: --</div>
</div>
<div class="chartBox" id="tv"></div>
</div>

<div class="right">

<div class="card">
<h3>MAIN SIGNAL</h3>
<div id="signalBox" class="signalBox yellow">WAIT</div>
<div id="trend">Trend: --</div>
<div id="entry">Entry: --</div>
<div id="tp">TP: --</div>
<div id="sl">SL: --</div>
</div>

<div class="card">
<h3>RSI MULTI TIMEFRAME</h3>
<div class="tfGrid">
<div class="tfBox" id="rsi30m">30M: --</div>
<div class="tfBox" id="rsi1h">1H: --</div>
<div class="tfBox" id="rsi4h">4H: --</div>
<div class="tfBox" id="rsi1d">1D: --</div>
<div class="tfBox" id="rsi1w">7D: --</div>
</div>
</div>

</div>

<script>

let symbol="BINANCE:BTCUSDT";
let price=0;

function loadChart(sym){
 document.getElementById("tv").innerHTML="";
 new TradingView.widget({
 width:"100%",
 height:"100%",
 symbol:sym,
 interval:"30",
 theme:"dark",
 style:"1",
 container_id:"tv"
 });
}

async function fetchKlines(interval){
 let url=`https://api.binance.com/api/v3/klines?symbol=${symbol.replace("BINANCE:","")}&interval=${interval}&limit=50`;
 let r=await fetch(url);
 let d=await r.json();
 return d.map(x=>parseFloat(x[4]));
}

function calcRSI(data){
 if(data.length<14) return 50;
 let gain=0,loss=0;
 for(let i=data.length-14;i<data.length;i++){
 let diff=data[i]-data[i-1];
 if(diff>0) gain+=diff; else loss+=Math.abs(diff);
 }
 let rs=gain/(loss||1);
 return 100-(100/(1+rs));
}

function state(r){
 if(r<30) return "OVERSOLD";
 if(r>70) return "OVERBOUGHT";
 return "NEUTRAL";
}

function applyNeutralBlink(tfBox, rsi){
 if(rsi>=30 && rsi<=70){
 tfBox.classList.add("neutralBlink");
 } else {
 tfBox.classList.remove("neutralBlink");
 }
}

async function updateRSI(){

let tf30 = await fetchKlines("30m");
let tf1h = await fetchKlines("1h");
let tf4h = await fetchKlines("4h");
let tf1d = await fetchKlines("1d");
let tf1w = await fetchKlines("1w");

let r30 = calcRSI(tf30);
let r1h = calcRSI(tf1h);
let r4h = calcRSI(tf4h);
let r1d = calcRSI(tf1d);
let r1w = calcRSI(tf1w);

let b30=document.getElementById("rsi30m");
let b1h=document.getElementById("rsi1h");
let b4h=document.getElementById("rsi4h");
let b1d=document.getElementById("rsi1d");
let b1w=document.getElementById("rsi1w");

b30.innerText="30M: "+r30.toFixed(2)+" ("+state(r30)+")";
b1h.innerText="1H: "+r1h.toFixed(2)+" ("+state(r1h)+")";
b4h.innerText="4H: "+r4h.toFixed(2)+" ("+state(r4h)+")";
b1d.innerText="1D: "+r1d.toFixed(2)+" ("+state(r1d)+")";
b1w.innerText="7D: "+r1w.toFixed(2)+" ("+state(r1w)+")";

// 🔥 NEUTRAL BLINK APPLY
applyNeutralBlink(b30,r30);
applyNeutralBlink(b1h,r1h);
applyNeutralBlink(b4h,r4h);
applyNeutralBlink(b1d,r1d);
applyNeutralBlink(b1w,r1w);

}

async function getPrice(){
 try{
 let r=await fetch("https://api.binance.com/api/v3/ticker/price?symbol="+symbol.replace("BINANCE:",""));
 let d=await r.json();
 price=parseFloat(d.price);
 document.getElementById("price").innerText="PRICE: "+price;
 }catch(e){}
}

function setSymbol(s){
 symbol="BINANCE:"+s;
 loadChart(symbol);
}

window.onload=function(){
 loadChart(symbol);
 getPrice();
 updateRSI();
 setInterval(getPrice,3000);
 setInterval(updateRSI,10000);
};

</script>

</body>
</html>
