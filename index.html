<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live Crypto Signal Engine</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
  display:flex;
}

.left{
  width:250px;
  background:#111827;
  padding:10px;
}

.center{
  flex:1;
  padding:10px;
}

.right{
  width:300px;
  background:#111827;
  padding:10px;
}

.card{
  background:#1f2937;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
}

.buy{color:#00ff88;}
.sell{color:#ff4d4d;}

.status{
  padding:6px;
  background:orange;
  display:inline-block;
  border-radius:5px;
}
</style>
</head>

<body>

<!-- LEFT -->
<div class="left">
<h3>PAIRS</h3>

<div onclick="setPair('BTCUSDT')">BTCUSDT</div>
<div onclick="setPair('ETHUSDT')">ETHUSDT</div>
<div onclick="setPair('BNBUSDT')">BNBUSDT</div>

</div>

<!-- CENTER -->
<div class="center">
<div id="chart"></div>
</div>

<!-- RIGHT -->
<div class="right">

<div class="card">
<div class="status" id="status">WAITING...</div>
</div>

<div class="card">
<div id="signal">Signal: -</div>
<div id="price">Price: -</div>
<div id="rsi">RSI: -</div>
</div>

</div>

<script>

let pair = "BTCUSDT";
let prices = [];

// ===== TradingView =====
function loadChart(symbol){
  new TradingView.widget({
    "container_id": "chart",
    "width": "100%",
    "height": 700,
    "symbol": "BINANCE:"+symbol,
    "interval": "30",
    "theme": "dark"
  });
}

// ===== CHANGE PAIR =====
function setPair(p){
  pair = p;
  prices = [];
  loadChart(pair);
}

// ===== FETCH BINANCE PRICE =====
async function getPrice(){
  let res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${pair}`);
  let data = await res.json();
  return parseFloat(data.price);
}

// ===== RSI CALC =====
function calculateRSI(arr){
  if(arr.length < 14) return 50;

  let gains = 0;
  let losses = 0;

  for(let i=1;i<14;i++){
    let diff = arr[i] - arr[i-1];
    if(diff >= 0) gains += diff;
    else losses += Math.abs(diff);
  }

  let rs = gains / (losses || 1);
  return 100 - (100 / (1 + rs));
}

// ===== SIGNAL ENGINE =====
function getSignal(rsi, price){
  
  // SIMPLE MARKET LOGIC
  if(rsi < 30) return "LONG";
  if(rsi > 70) return "SHORT";
  return "WAIT";
}

// ===== MAIN LOOP =====
async function update(){

  let price = await getPrice();
  prices.push(price);

  if(prices.length > 20) prices.shift();

  let rsi = calculateRSI(prices);
  let signal = getSignal(rsi, price);

  document.getElementById("price").innerText = "Price: "+price;
  document.getElementById("rsi").innerText = "RSI: "+rsi.toFixed(2);

  if(signal === "LONG"){
    document.getElementById("signal").innerHTML = "<span class='buy'>LONG SIGNAL</span>";
    document.getElementById("status").innerText = "BUY CONDITION ACTIVE";
  }
  else if(signal === "SHORT"){
    document.getElementById("signal").innerHTML = "<span class='sell'>SHORT SIGNAL</span>";
    document.getElementById("status").innerText = "SELL CONDITION ACTIVE";
  }
  else {
    document.getElementById("signal").innerText = "WAITING...";
    document.getElementById("status").innerText = "NO TRADE";
  }
}

// ===== INIT =====
loadChart(pair);
setInterval(update, 3000);

</script>

</body>
</html>
