<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SMART TRADING SYSTEM v7</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

.container{
display:flex;
height:100vh;
}

/* LEFT */
.left{
width:55%;
border-right:1px solid #1f2937;
}

/* RIGHT */
.right{
width:45%;
padding:12px;
background:#0f172a;
overflow:auto;
}

/* SIGNAL */
.signal{
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
border-radius:12px;
margin-bottom:10px;
}

.long{background:#16a34a;}
.short{background:#dc2626;}
.neutral{background:#facc15;color:black;}

/* BOX */
.box{
background:#111827;
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.row{
display:flex;
justify-content:space-between;
margin:6px 0;
}

/* LIGHT */
.light{
width:12px;
height:12px;
border-radius:50%;
display:inline-block;
background:#555;
}

.g{background:#22c55e;}
.r{background:#ef4444;}
.y{background:#facc15;}
</style>
</head>

<body>

<div class="container">

<div class="left">
<div id="chart"></div>
</div>

<div class="right">

<h2>SMART ENGINE v7</h2>

<div id="signal" class="signal neutral">NEUTRAL</div>

<div class="box">
<div class="row"><span>Entry</span><span id="entry">--</span></div>
<div class="row"><span>TP</span><span id="tp">--</span></div>
<div class="row"><span>SL</span><span id="sl">--</span></div>
</div>

<div class="box">
<div class="row"><span>RSI</span><span id="rsi">--</span></div>
<div class="row"><span>EMA Trend</span><span id="trend">--</span></div>
<div class="row"><span>Score</span><span id="score">--</span></div>
</div>

</div>

</div>

<script>

let symbol="BINANCE:BTCUSDT";

/* CHART */
new TradingView.widget({
container_id:"chart",
width:"100%",
height:"100%",
symbol:symbol,
interval:"30",
theme:"dark",
style:"1"
});

/* DATA */
async function getCloses(tf){
let r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol.replace("BINANCE:","")}&interval=${tf}&limit=50`);
let d=await r.json();
return d.map(x=>parseFloat(x[4]));
}

/* RSI */
function rsi(c){
let g=0,l=0;
for(let i=1;i<c.length;i++){
let d=c[i]-c[i-1];
if(d>0) g+=d;
else l+=Math.abs(d);
}
let rs=g/(l||1);
return 100-(100/(1+rs));
}

/* EMA */
function ema(c){
let short=c.slice(-10).reduce((a,b)=>a+b)/10;
let long=c.slice(-30).reduce((a,b)=>a+b)/30;
return short>long ? "BULL" : "BEAR";
}

/* SCORE ENGINE */
function score(rsiVal,trend){

let score=0;

if(rsiVal<35) score++;
if(rsiVal>65) score--;

if(trend=="BULL") score++;
if(trend=="BEAR") score--;

return score;
}

/* SIGNAL */
function signal(score){
if(score>=2) return "LONG";
if(score<=-2) return "SHORT";
return "NEUTRAL";
}

/* UI */
function ui(sig,price,rsiVal,tr,sc){

let box=document.getElementById("signal");

box.className="signal";

if(sig=="LONG") box.classList.add("long");
if(sig=="SHORT") box.classList.add("short");
if(sig=="NEUTRAL") box.classList.add("neutral");

box.innerText=sig;

document.getElementById("entry").innerText=price.toFixed(2);

if(sig=="LONG"){
document.getElementById("tp").innerText=(price*1.02).toFixed(2);
document.getElementById("sl").innerText=(price*0.99).toFixed(2);
}
else if(sig=="SHORT"){
document.getElementById("tp").innerText=(price*0.98).toFixed(2);
document.getElementById("sl").innerText=(price*1.01).toFixed(2);
}
else{
document.getElementById("tp").innerText="--";
document.getElementById("sl").innerText="--";
}

document.getElementById("rsi").innerText=rsiVal.toFixed(2);
document.getElementById("trend").innerText=tr;
document.getElementById("score").innerText=sc;

}

/* LOOP */
async function update(){

let c=await getCloses("4h");

let r=rsi(c);
let tr=ema(c);
let sc=score(r,tr);

let sig=signal(sc);

let price=c[c.length-1];

ui(sig,price,r,tr,sc);

}

setInterval(update,10000);

</script>

</body>
</html>
