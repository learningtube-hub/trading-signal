<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRO TRADER CENTER LAYOUT v6</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

/* TOP NAV */
.topbar{
height:30px;
background:#111827;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
}

.topbar a{
color:white;
margin:0 10px;
text-decoration:none;
font-size:14px;
opacity:0.8;
}

.topbar a:hover{opacity:1}

/* MAIN WRAPPER */
.main{
display:flex;
height:calc(100vh - 55px);
justify-content:space-between;
align-items:center; /* 👈 CENTER VERTICAL */
}

/* LEFT SIDEBAR */
.left{
width:20%;
background:#0f172a;
padding:10px;
height:90%;
overflow:auto;
border-right:1px solid #1f2937;
}

.coin{
padding:10px;
margin:6px 0;
background:#111827;
border-radius:8px;
cursor:pointer;
}

/* CENTER CHART (40%) */
.center{
width:40%;
height:85%;
display:flex;
align-items:center;
justify-content:center;
}

.chartBox{
width:100%;
height:100%;
border-radius:12px;
overflow:hidden;
}

/* RIGHT SIDEBAR */
.right{
width:20%;
background:#0f172a;
padding:10px;
height:90%;
overflow:auto;
border-left:1px solid #1f2937;
}

/* SIGNAL BOX */
.signal{
padding:16px;
font-size:22px;
font-weight:bold;
text-align:center;
border-radius:10px;
margin-bottom:10px;
}

.buy{background:#16a34a;}
.sell{background:#dc2626;}
.wait{background:#facc15;color:black;}

/* BOX */
.box{
background:#111827;
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.row{
display:flex;
justify-content:space-between;
margin:6px 0;
font-size:13px;
}

/* MOBILE */
@media(max-width:900px){
.main{flex-direction:column;}
.left,.center,.right{
width:100%;
height:33%;
}
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
<div><b>PRO TRADER CENTER v6</b></div>
<div>
<a href="#">Home</a>
<a href="#">Signals</a>
<a href="#">Profile</a>
<a href="#">Login</a>
</div>
</div>

<!-- MAIN -->
<div class="main">

<!-- LEFT -->
<div class="left">
<h3>COINS</h3>
<div class="coin">BTCUSDT</div>
<div class="coin">ETHUSDT</div>
<div class="coin">SOLUSDT</div>
<div class="coin">BNBUSDT</div>
</div>

<!-- CENTER CHART -->
<div class="center">
<div id="chart" class="chartBox"></div>
</div>

<!-- RIGHT -->
<div class="right">

<div id="signal" class="signal wait">WAIT</div>

<div class="box">
<div class="row"><span>Entry</span><span id="entry">--</span></div>
<div class="row"><span>TP</span><span id="tp">--</span></div>
<div class="row"><span>SL</span><span id="sl">--</span></div>
</div>

<div class="box">
<div class="row"><span>RSI</span><span id="rsi">--</span></div>
<div class="row"><span>Trend</span><span id="trend">--</span></div>
</div>

</div>

</div>

<script>

let symbol="BINANCE:BTCUSDT";

/* CHART */
new TradingView.widget({
container_id:"chart",
width:"100%",
height:"100%",
symbol:symbol,
interval:"30",
theme:"dark",
style:"1"
});

/* DATA */
async function getCloses(tf){
let r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol.replace("BINANCE:","")}&interval=${tf}&limit=50`);
let d=await r.json();
return d.map(x=>parseFloat(x[4]));
}

/* RSI */
function rsi(c){
let g=0,l=0;
for(let i=1;i<c.length;i++){
let d=c[i]-c[i-1];
if(d>0) g+=d;
else l+=Math.abs(d);
}
let rs=g/(l||1);
return 100-(100/(1+rs));
}

/* SIGNAL */
function signal(r){
if(r<35) return "BUY";
if(r>65) return "SELL";
return "WAIT";
}

/* UI */
function updateUI(sig,price,r){

let s=document.getElementById("signal");
s.className="signal";

if(sig=="BUY") s.classList.add("buy");
if(sig=="SELL") s.classList.add("sell");
if(sig=="WAIT") s.classList.add("wait");

s.innerText=sig;

document.getElementById("entry").innerText=price.toFixed(2);

if(sig=="BUY"){
document.getElementById("tp").innerText=(price*1.02).toFixed(2);
document.getElementById("sl").innerText=(price*0.99).toFixed(2);
}
else if(sig=="SELL"){
document.getElementById("tp").innerText=(price*0.98).toFixed(2);
document.getElementById("sl").innerText=(price*1.01).toFixed(2);
}
else{
document.getElementById("tp").innerText="--";
document.getElementById("sl").innerText="--";
}

document.getElementById("rsi").innerText=r.toFixed(2);
document.getElementById("trend").innerText=r>50?"BULL":"BEAR";
}

/* LOOP */
async function update(){

let c=await getCloses("4h");
let price=c[c.length-1];
let r=rsi(c);
let sig=signal(r);

updateUI(sig,price,r);

}

setInterval(update,10000);

</script>

</body>
</html>
