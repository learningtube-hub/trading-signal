<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stable Trading Terminal</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
  background:#0b1220;
  color:white;
  height:100vh;
  display:flex;
}

/* LEFT */
.left{
  width:200px;
  background:#0f172a;
  padding:10px;
  border-right:1px solid #1f2937;
}

.pair{
  padding:10px;
  background:#111827;
  margin:6px 0;
  border-radius:8px;
  cursor:pointer;
  text-align:center;
}

/* CENTER */
.center{
  flex:1;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:50px;
  background:#0f172a;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 12px;
  border-bottom:1px solid #1f2937;
}

/* FIXED HEIGHT CONTAINER (IMPORTANT) */
.chartBox{
  flex:1;
  min-height:500px;
  margin:10px;
  border:1px solid #1f2937;
  border-radius:12px;
  overflow:hidden;
}

/* RIGHT */
.right{
  width:260px;
  background:#0f172a;
  padding:10px;
  border-left:1px solid #1f2937;
}

.card{
  background:#111827;
  padding:12px;
  border-radius:12px;
}

.btnRow{display:flex;gap:10px;margin-top:10px;}

.btn{
  flex:1;
  padding:10px;
  border-radius:20px;
  border:none;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.green{background:#22c55e;}
.red{background:#ef4444;}
</style>
</head>

<body>

<div class="left">
  <div class="pair" onclick="load('BTCUSDT')">BTC/USDT</div>
  <div class="pair" onclick="load('ETHUSDT')">ETH/USDT</div>
  <div class="pair" onclick="load('SOLUSDT')">SOL/USDT</div>
</div>

<div class="center">
  <div class="topbar">
    <div>TRADING TERMINAL</div>
    <div id="price">PRICE: --</div>
  </div>

  <div class="chartBox" id="tv"></div>
</div>

<div class="right">
  <div class="card">
    <h3>SIGNAL</h3>
    <div id="signal">WAITING...</div>

    <div class="btnRow">
      <button class="btn green" onclick="sig('LONG')">LONG</button>
      <button class="btn red" onclick="sig('SHORT')">SHORT</button>
    </div>
  </div>
</div>

<script>

let symbol="BTCUSDT";
let widget;

function load(sym){

  symbol=sym;

  document.getElementById("tv").innerHTML="";

  widget = new TradingView.widget({
    width: "100%",
    height: "100%",
    symbol: "BINANCE:"+sym,
    interval: "1",
    theme: "dark",
    style: "1",
    container_id: "tv"
  });
}

function sig(type){
  document.getElementById("signal").innerText = type;
  document.getElementById("signal").style.color = type==="LONG" ? "#22c55e" : "#ef4444";
}

load(symbol);

</script>

</body>
</html>
