<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading AI Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white">

<nav class="bg-gray-800 p-4 flex justify-between items-center">
<h1 class="text-green-400 font-bold text-xl">Trading AI</h1>

<div class="space-x-4">
<a href="#home" class="hover:text-green-400">Home</a>
<a href="#signals" class="hover:text-green-400">Signals</a>
<a href="#chart" class="hover:text-green-400">Chart</a>
<a href="#ai" class="hover:text-green-400">AI</a>
</div>
</nav>

<section id="home" class="text-center mt-20 px-4">
<h1 class="text-4xl font-bold text-green-400">Welcome to Trading Signal AI 🚀</h1>
<p class="mt-4 text-gray-300">Live signals + AI assistant + chart analysis</p>

<a href="#signals" class="mt-6 inline-block px-6 py-2 bg-green-500 rounded-xl">View Signals</a>
</section>

<section id="chart" class="mt-20 px-6 text-center">

  <h2 class="text-3xl font-bold mb-6">Crypto Market Overview 📊</h2>

  <p class="text-gray-400 mb-10">Live charts for top crypto assets</p>

  <div class="grid md:grid-cols-2 gap-6 max-w-6xl mx-auto">

    <!-- BTC -->
    <div class="bg-gray-800 p-2 rounded-xl">
      <h3 class="text-green-400 font-bold mb-2">BTC / USDT</h3>
      <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:BTCUSDT&theme=dark"
      width="100%" height="300" frameborder="0" scrolling="no"></iframe>
    </div>

    <!-- ETH -->
    <div class="bg-gray-800 p-2 rounded-xl">
      <h3 class="text-blue-400 font-bold mb-2">ETH / USDT</h3>
      <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:ETHUSDT&theme=dark"
      width="100%" height="300" frameborder="0" scrolling="no"></iframe>
    </div>

    <!-- BNB -->
    <div class="bg-gray-800 p-2 rounded-xl">
      <h3 class="text-yellow-400 font-bold mb-2">BNB / USDT</h3>
      <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:BNBUSDT&theme=dark"
      width="100%" height="300" frameborder="0" scrolling="no"></iframe>
    </div>

    <!-- SOL -->
    <div class="bg-gray-800 p-2 rounded-xl">
      <h3 class="text-purple-400 font-bold mb-2">SOL / USDT</h3>
      <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:SOLUSDT&theme=dark"
      width="100%" height="300" frameborder="0" scrolling="no"></iframe>
    </div>

    <!-- XRP -->
    <div class="bg-gray-800 p-2 rounded-xl">
      <h3 class="text-pink-400 font-bold mb-2">XRP / USDT</h3>
      <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:XRPUSDT&theme=dark"
      width="100%" height="300" frameborder="0" scrolling="no"></iframe>
    </div>

    <!-- SUI -->
    <div class="bg-gray-800 p-2 rounded-xl">
      <h3 class="text-cyan-400 font-bold mb-2">SUI / USDT</h3>
      <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:SUIUSDT&theme=dark"
      width="100%" height="300" frameborder="0" scrolling="no"></iframe>
    </div>

  </div>

</section>

<section id="ai" class="mt-20 px-6 text-center">

<h2 class="text-3xl font-bold mb-6">AI Trading Assistant 🤖</h2>

<div class="bg-gray-800 p-6 rounded-xl max-w-xl mx-auto">

<input id="userInput" type="text"
placeholder="Ask BTC, ETH, BNB..."
class="w-full p-3 rounded-lg text-black">

<button onclick="getResponse()"
class="mt-4 px-6 py-2 bg-blue-500 rounded-xl">
Ask AI
</button>

<p id="response" class="mt-4 text-green-400"></p>

</div>

</section>

<script>
function getResponse(){
let input=document.getElementById("userInput").value.toLowerCase();
let output=document.getElementById("response");

if(input.includes("btc")){
output.innerText="AI: BTC STRONG 📈";
}
else if(input.includes("eth")){
output.innerText="AI: ETH WEAK 📉";
}
else if(input.includes("bnb")){
output.innerText="AI: BNB STABLE ⚡";
}
else{
output.innerText="AI: Need more data 🤖";
}
}
</script>

</body>
</html>
