<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crypto Signal Dashboard Pro</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b1220;
  color:white;
  display:flex;
}

/* SIDEBAR */
.sidebar {
  width:300px;
  background:#111827;
  height:100vh;
  overflow-y:auto;
  padding:15px;
}

.pair {
  padding:10px;
  margin:8px 0;
  background:#1f2937;
  cursor:pointer;
  border-radius:6px;
}

.pair:hover {
  background:#374151;
}

/* MAIN */
.main {
  flex:1;
  padding:20px;
}

.card {
  background:#1f2937;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

.status {
  padding:8px;
  display:inline-block;
  border-radius:6px;
  background:orange;
}

.buy { color:#00ff88; }
.sell { color:#ff4d4d; }

.chart {
  height:300px;
  background:#0f172a;
  border:1px solid #334155;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h3>Pairs</h3>

  <div class="pair" onclick="selectPair('BTC')">BTCUSDT</div>
  <div class="pair" onclick="selectPair('ETH')">ETHUSDT</div>
  <div class="pair" onclick="selectPair('BNB')">BNBUSDT</div>
  <div class="pair" onclick="selectPair('XRP')">XRPUSDT</div>
  <div class="pair" onclick="selectPair('SOL')">SOLUSDT</div>
  <div class="pair" onclick="selectPair('ADA')">ADAUSDT</div>

  <hr>

  <div class="card">
    <h4>Trade Panel</h4>
    <p id="status">WAITING FOR SIGNAL</p>
    <p id="signal">Signal: -</p>
    <p id="entry">Entry: -</p>
    <p id="tp">TP: -</p>
    <p id="sl">SL: -</p>
  </div>

</div>

<!-- MAIN -->
<div class="main">

  <h2 id="title">BTCUSDT Dashboard</h2>

  <div class="card">
    <h4>Live Price</h4>
    <h1 id="price">0</h1>
  </div>

  <div class="chart" id="chart">
    PRICE CHART (SIMPLE VIEW)
  </div>

</div>

<script>

// ===== DATA =====
let currentPair = "BTC";

let basePrices = {
  BTC:65000,
  ETH:3200,
  BNB:580,
  XRP:0.6,
  SOL:140,
  ADA:0.5
};

// ===== STATE =====
let trade = null;
let state = "WAITING";

// ===== SELECT PAIR =====
function selectPair(pair){
  currentPair = pair;
  document.getElementById("title").innerText = pair + "USDT Dashboard";

  // reset state when switching
  state = "WAITING";
  trade = null;
}

// ===== SIGNAL =====
function getSignal(price, base){
  return price > base ? "BUY" : "SELL";
}

// ===== UPDATE ENGINE =====
function update(){

  let base = basePrices[currentPair];

  // fake live movement
  let price = base + (Math.random()*200 - 100);

  document.getElementById("price").innerText = price.toFixed(2);

  // TRADE LOGIC
  if(state === "WAITING"){

    let signal = getSignal(price, base);

    trade = {
      signal: signal,
      entry: price,
      tp: signal === "BUY" ? price*1.03 : price*0.97,
      sl: signal === "BUY" ? price*0.97 : price*1.03
    };

    state = "OPEN";

    document.getElementById("status").innerText = "TRADE ACTIVE";
    document.getElementById("signal").innerText = "Signal: " + signal;
    document.getElementById("entry").innerText = "Entry: " + price.toFixed(2);
    document.getElementById("tp").innerText = "TP: " + trade.tp.toFixed(2);
    document.getElementById("sl").innerText = "SL: " + trade.sl.toFixed(2);

  } else {

    // CHECK TP/SL
    if(price >= trade.tp || price <= trade.sl){

      state = "WAITING";

      document.getElementById("status").innerText =
        (price >= trade.tp) ? "TAKE PROFIT HIT → WAITING" : "STOP LOSS HIT → WAITING";

      trade = null;
    }
  }

  // chart fake update
  document.getElementById("chart").innerText =
    currentPair + " LIVE PRICE MOVING...";
}

// ===== LOOP =====
update();
setInterval(update, 3000);

</script>

</body>
</html>
