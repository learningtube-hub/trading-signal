<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS AI // Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 
                        darkBg: '#03050d', 
                        lightBg: '#f8fafc',
                        neonGreen: '#00ffa3', 
                        neonBlue: '#00e5ff', 
                        gold: '#ffd700' 
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg dark:bg-darkBg light:bg-lightBg text-slate-900 dark:text-gray-100 transition-colors duration-300">

    <!-- হেডার বা স্ট্যাটাস সেকশন (লাইট মোড ফিক্সড) -->
    <div class="p-6">
        <header class="flex flex-wrap gap-4 border-b border-slate-300 dark:border-slate-800 pb-4">
            <!-- WIN RATE (Light: Text-Slate-600, Dark: Text-Slate-400) -->
            <div class="bg-slate-200 dark:bg-black/40 border border-slate-300 dark:border-neonGreen/20 px-3 py-1.5 rounded-xl flex items-center gap-2">
                <span class="text-slate-600 dark:text-slate-400 font-bold">WIN RATE:</span>
                <span class="text-green-700 dark:text-neonGreen font-bold">89.4%</span>
            </div>

            <!-- MONTHLY ROI -->
            <div class="bg-slate-200 dark:bg-black/40 border border-slate-300 dark:border-neonBlue/20 px-3 py-1.5 rounded-xl flex items-center gap-2">
                <span class="text-slate-600 dark:text-slate-400 font-bold">ROI:</span>
                <span class="text-blue-700 dark:text-neonBlue font-bold">+540%</span>
            </div>
        </header>

        <!-- মার্কেট আপডেট বোর্ড -->
        <div class="mt-6 bg-slate-200 dark:bg-black/40 border-l-4 border-blue-500 dark:border-neonBlue p-4 rounded-r-xl">
            <p class="text-slate-800 dark:text-slate-300">
                <span class="font-bold text-slate-950 dark:text-white uppercase">Market Update:</span> 
                Bitcoin is consolidation near $67.4k.
            </p>
        </div>
    </div>

    <!-- থিম টগল বাটন -->
    <button onclick="toggleTheme()" class="m-6 p-3 bg-slate-300 dark:bg-slate-800 rounded-lg">Toggle Theme</button>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            html.classList.toggle('light');
        }
    </script>
</body>
</html>
