<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Crypto Pro Trading Dashboard</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b1220;
  color:white;
}

/* TOP BAR */
.topbar {
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:#111827;
}

/* AUTH BOX */
.auth {
  padding:10px;
}

input {
  padding:8px;
  margin:5px;
}

/* MAIN LAYOUT */
.container {
  display:flex;
}

/* LEFT PANEL */
.left {
  width:250px;
  background:#111827;
  height:100vh;
  padding:10px;
  overflow-y:auto;
}

.pair {
  padding:10px;
  margin:5px 0;
  background:#1f2937;
  cursor:pointer;
  border-radius:5px;
}

/* CENTER CHART */
.center {
  flex:1;
  padding:10px;
}

/* RIGHT PANEL */
.right {
  width:250px;
  background:#111827;
  height:100vh;
  padding:10px;
}

.status {
  padding:8px;
  background:orange;
  display:inline-block;
  border-radius:5px;
}

button {
  padding:8px;
  margin:5px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <div>Crypto Trading Pro</div>

  <div class="auth">
    <input placeholder="Email">
    <input placeholder="Password" type="password">
    <button onclick="login()">Login</button>
    <button onclick="register()">Register</button>
  </div>
</div>

<div class="container">

<!-- LEFT PAIRS -->
<div class="left">
  <h3>Pairs</h3>

  <div class="pair" onclick="changeSymbol('BINANCE:BTCUSDT')">BTCUSDT</div>
  <div class="pair" onclick="changeSymbol('BINANCE:ETHUSDT')">ETHUSDT</div>
  <div class="pair" onclick="changeSymbol('BINANCE:BNBUSDT')">BNBUSDT</div>
  <div class="pair" onclick="changeSymbol('BINANCE:XRPUSDT')">XRPUSDT</div>
  <div class="pair" onclick="changeSymbol('BINANCE:SOLUSDT')">SOLUSDT</div>
  <div class="pair" onclick="changeSymbol('BINANCE:ADAUSDT')">ADAUSDT</div>
</div>

<!-- CENTER CHART -->
<div class="center">

<div id="tradingview_chart"></div>

</div>

<!-- RIGHT PANEL -->
<div class="right">

<h3>Trade Panel</h3>

<p class="status" id="status">WAITING FOR SIGNAL</p>

<p id="signal">Signal: -</p>
<p id="entry">Entry: -</p>
<p id="tp">TP: -</p>
<p id="sl">SL: -</p>

</div>

</div>

<script>

// ===== LOGIN (dummy) =====
function login(){
  alert("Login successful (frontend only)");
}

function register(){
  alert("Register successful (frontend only)");
}

// ===== DEFAULT SYMBOL =====
let currentSymbol = "BINANCE:BTCUSDT";

// ===== TRADINGVIEW CHART =====
function loadChart(symbol){

  new TradingView.widget({
    "container_id": "tradingview_chart",
    "width": "100%",
    "height": 700,
    "symbol": symbol,
    "interval": "30",
    "timezone": "Asia/Dhaka",
    "theme": "dark",
    "style": "1",
    "locale": "en",
    "toolbar_bg": "#111827",
    "enable_publishing": false,
    "hide_top_toolbar": false,
    "save_image": false
  });
}

// ===== CHANGE PAIR =====
function changeSymbol(symbol){
  currentSymbol = symbol;
  loadChart(symbol);

  document.getElementById("status").innerText = "WAITING FOR SIGNAL";
}

// ===== INIT =====
loadChart(currentSymbol);

</script>

</body>
</html>
