<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FULL FIXED UI TRADING BOT</title>
<script src="https://s3.tradingview.com/tv.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#0b1220;color:#e5e7eb;height:100vh;display:flex;overflow:hidden;}

.left{width:180px;background:#0f172a;border-right:1px solid #1f2937;padding:10px;}
.pair{padding:10px;margin:6px 0;background:#111827;border-radius:8px;text-align:center;cursor:pointer;}

.center{flex:1;display:flex;flex-direction:column;}
.topbar{height:50px;background:#0f172a;border-bottom:1px solid #1f2937;display:flex;justify-content:space-between;align-items:center;padding:0 10px;}
.chartBox{flex:1;margin:8px;border-radius:12px;overflow:hidden;border:1px solid #1f2937;}

.right{width:360px;background:#0f172a;border-left:1px solid #1f2937;padding:10px;overflow:auto;}

.card{background:#111827;padding:12px;border-radius:12px;margin-bottom:10px;}

.signalBox{padding:14px;border-radius:12px;text-align:center;font-size:18px;font-weight:bold;margin-top:10px;}
.green{background:#16a34a;color:white;}
.red{background:#dc2626;color:white;}
.yellow{background:#f59e0b;color:black;}

.small{font-size:12px;opacity:0.85;margin-top:4px;}

.indGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
canvas{width:100%;height:120px;background:#0b1220;border-radius:10px;}

.btnRow{display:flex;gap:8px;margin-top:10px;}
.btn{flex:1;padding:8px;border-radius:8px;text-align:center;font-weight:bold;}
.btn.long{background:#16a34a;color:#fff;}
.btn.short{background:#dc2626;color:#fff;}
.btn.wait{background:#6b7280;color:#fff;}

</style>
</head>

<body>

<div class="left">
<h3>MARKETS</h3>
<div class="pair" onclick="setSymbol('BTCUSDT')">BTC</div>
<div class="pair" onclick="setSymbol('ETHUSDT')">ETH</div>
<div class="pair" onclick="setSymbol('SOLUSDT')">SOL</div>
</div>

<div class="center">
<div class="topbar">
<div id="title">FULL FIXED SIGNAL BOT</div>
<div id="price">PRICE: --</div>
</div>
<div class="chartBox" id="tv"></div>
</div>

<div class="right">

<div class="card">
<h3>LIVE SIGNAL</h3>
<div id="signalBox" class="signalBox yellow">WAIT</div>
<div class="btnRow">
<div id="btnLong" class="btn long">LONG</div>
<div id="btnShort" class="btn short">SHORT</div>
<div id="btnWait" class="btn wait">WAIT</div>
</div>
<div class="small" id="trend">Trend: --</div>
<div class="small" id="entry">Entry: --</div>
<div class="small" id="tp">TP: --</div>
<div class="small" id="sl">SL: --</div>
</div>

<div class="card">
<h3>RSI INDICATOR</h3>
<div id="rsiText">RSI: --</div>
<div id="rsiState">State: --</div>
<canvas id="rsiChart" width="300" height="120"></canvas>
</div>

<div class="card">
<h3>DIVERGENCE WARNING</h3>
<div id="divText">--</div>
</div>

</div>

<script>

let symbol="BINANCE:BTCUSDT";
let prices=[];
let rsiArr=[];
let price=0;

function loadChart(sym){
 document.getElementById("tv").innerHTML="";
 new TradingView.widget({
 width:"100%",
 height:"100%",
 symbol:sym,
 interval:"1",
 theme:"dark",
 style:"1",
 container_id:"tv"
 });
}

async function getPrice(){
 try{
 let r=await fetch("https://api.binance.com/api/v3/ticker/price?symbol="+symbol.replace("BINANCE:",""));
 let d=await r.json();
 price=parseFloat(d.price);

 prices.push(price);
 if(prices.length>100) prices.shift();

 let rsiVal=calcRSI(prices);
 rsiArr.push(rsiVal);
 if(rsiArr.length>50) rsiArr.shift();

 document.getElementById("price").innerText="PRICE: "+price;

 engine(rsiVal);
 drawRSI();
 }catch(e){}
}

function calcRSI(data){
 if(data.length<15) return 50;
 let gain=0,loss=0;
 for(let i=data.length-14;i<data.length;i++){
 let diff=data[i]-data[i-1];
 if(diff>0) gain+=diff; else loss+=Math.abs(diff);
 }
 let rs=gain/(loss||1);
 return 100-(100/(1+rs));
}

function state(r){
 if(r<30) return "OVERSOLD 🟢";
 if(r>70) return "OVERBOUGHT 🔴";
 return "NEUTRAL 🟡";
}

function trend(){
 let r=prices.slice(-20);
 let max=Math.max(...r);
 let min=Math.min(...r);
 return price>(max+min)/2 ? "UPTREND" : "DOWNTREND";
}

function divergence(r){
 if(prices.length<10) return "WAITING DATA";
 let last=prices[prices.length-1];
 let prev=prices[prices.length-5];

 if(last>prev && r<50) return "BULLISH DIVERGENCE (WARNING BUY) 🟢";
 if(last<prev && r>50) return "BEARISH DIVERGENCE (WARNING SELL) 🔴";
 return "NO DIVERGENCE";
}

function engine(rsiVal){

let tr=trend();
let st=state(rsiVal);
let div=divergence(rsiVal);

let signal="WAIT";
let color="yellow";

if(tr=="UPTREND" && rsiVal<35){signal="LONG";color="green";}
if(tr=="DOWNTREND" && rsiVal>65){signal="SHORT";color="red";}

let entry=price;
let tp=signal=="LONG"?price*1.003:signal=="SHORT"?price*0.997:"--";
let sl=signal=="LONG"?price*0.998:signal=="SHORT"?price*1.002:"--";

let box=document.getElementById("signalBox");
box.innerText=signal;
box.className="signalBox "+color;

document.getElementById("btnLong").style.opacity=signal=="LONG"?"1":"0.4";
document.getElementById("btnShort").style.opacity=signal=="SHORT"?"1":"0.4";
document.getElementById("btnWait").style.opacity=signal=="WAIT"?"1":"0.4";

document.getElementById("trend").innerText="Trend: "+tr;
document.getElementById("rsiText").innerText="RSI: "+rsiVal.toFixed(2);
document.getElementById("rsiState").innerText="State: "+st;
document.getElementById("divText").innerText=div;

document.getElementById("entry").innerText="Entry: "+entry;
document.getElementById("tp").innerText="TP: "+tp;
document.getElementById("sl").innerText="SL: "+sl;

}

function drawRSI(){
let c=document.getElementById("rsiChart");
let ctx=c.getContext("2d");
ctx.clearRect(0,0,c.width,c.height);

ctx.beginPath();
for(let i=0;i<rsiArr.length;i++){
let x=i*(c.width/rsiArr.length);
let y=c.height-(rsiArr[i]/100)*c.height;
if(i==0)ctx.moveTo(x,y);
else ctx.lineTo(x,y);
}
ctx.strokeStyle="#38bdf8";
ctx.stroke();
}

function setSymbol(s){
symbol="BINANCE:"+s;
prices=[];
rsiArr=[];
loadChart(symbol);
}

window.onload=function(){
loadChart(symbol);
getPrice();
setInterval(getPrice,3000);
};

</script>

</body>
</html>
