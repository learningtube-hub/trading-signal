<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Signal AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white">

  <!-- NAVBAR -->
  <nav class="bg-gray-800 p-4 flex justify-between items-center">
    <h1 class="text-green-400 font-bold text-xl">Trading AI</h1>

    <div class="space-x-4">
      <a href="#" class="hover:text-green-400">Home</a>
      <a href="#" class="hover:text-green-400">Signals</a>
      <a href="#" class="hover:text-green-400">AI</a>
    </div>
  </nav>

  <!-- HERO SECTION -->
  <section class="text-center mt-20 px-4">
    <h1 class="text-4xl font-bold text-green-400">
      Welcome to Trading Signal AI
    </h1>

    <p class="mt-4 text-gray-300">
      Your smart AI trading assistant is ready 🚀
    </p>

    <button onclick="document.getElementById('signals').scrollIntoView({behavior:'smooth'})"
class="mt-6 px-6 py-2 bg-green-500 rounded-xl">
  View Signals
</button>
  </section>

  <!-- SIGNALS SECTION -->
  <section class="mt-20 px-6 text-center">

  <h2 class="text-3xl font-bold mb-8">Live Trading Signals</h2>

  <div class="grid md:grid-cols-3 gap-6">

    <div class="bg-gray-800 p-6 rounded-xl hover:bg-gray-700 transition">
      <h3 class="text-green-400 font-bold text-xl">BUY BTC</h3>
      <p class="text-gray-300 mt-2">High Confidence Signal</p>
    </div>

    <div class="bg-gray-800 p-6 rounded-xl hover:bg-gray-700 transition">
      <h3 class="text-red-400 font-bold text-xl">SELL ETH</h3>
      <p class="text-gray-300 mt-2">Medium Confidence Signal</p>
    </div>

    <div class="bg-gray-800 p-6 rounded-xl hover:bg-gray-700 transition">
      <h3 class="text-green-400 font-bold text-xl">BUY BNB</h3>
      <p class="text-gray-300 mt-2">Strong Signal</p>
    </div>

  </div>

</section>
  </section>

</body>
</html>
