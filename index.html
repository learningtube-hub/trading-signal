<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>PRO AI SIGNAL TERMINAL</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#081018;
font-family:Arial;
color:white;
overflow:hidden;
}

/* TOPBAR */

.topbar{
height:60px;
background:#0f172a;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
border-bottom:1px solid #1f2937;
}

.logo{
font-size:20px;
font-weight:bold;
color:#22c55e;
}

/* MAIN */

.main{
display:flex;
height:calc(100vh - 60px);
padding:12px;
gap:12px;
}

/* LEFT PANEL */

.left{
width:20%;
background:#0f172a;
border-radius:12px;
padding:12px;
overflow:auto;
}

/* CENTER */

.center{
width:40%;
background:#111827;
border-radius:14px;
overflow:hidden;
position:relative;
}

/* RIGHT PANEL */

.right{
width:20%;
background:#0f172a;
border-radius:12px;
padding:12px;
overflow:auto;
}

/* PAIRS */

.pair{
background:#111827;
padding:14px;
border-radius:10px;
margin-bottom:10px;
cursor:pointer;
transition:0.3s;
border:1px solid transparent;
}

.pair:hover{
border-color:#22c55e;
transform:scale(1.02);
}

.activePair{
border-color:#22c55e;
background:#162033;
}

/* SIGNAL */

.signal{
padding:18px;
text-align:center;
border-radius:12px;
font-size:24px;
font-weight:bold;
margin-bottom:14px;
}

.long{
background:#16a34a;
}

.short{
background:#dc2626;
}

.neutral{
background:#facc15;
color:black;
}

/* LIGHTS */

.lightBox{
background:#111827;
padding:12px;
border-radius:12px;
margin-bottom:12px;
}

.lightRow{
display:flex;
justify-content:space-between;
align-items:center;
margin:10px 0;
}

.light{
width:18px;
height:18px;
border-radius:50%;
background:#555;
animation:blink 1s infinite;
}

.green{
background:#22c55e;
}

.red{
background:#ef4444;
}

.yellow{
background:#facc15;
}

@keyframes blink{

0%{
opacity:1;
}

50%{
opacity:0.3;
}

100%{
opacity:1;
}

}

/* INFO */

.info{
background:#111827;
padding:12px;
border-radius:12px;
margin-bottom:12px;
}

.row{
display:flex;
justify-content:space-between;
margin:10px 0;
}

/* BAR */

.barWrap{
width:100%;
height:18px;
background:#222;
border-radius:10px;
overflow:hidden;
margin-top:10px;
}

.bar{
height:100%;
width:50%;
background:#22c55e;
transition:0.4s;
}

/* CHART OVERLAY */

.overlaySignal{
position:absolute;
top:20px;
left:20px;
z-index:99;
padding:10px 16px;
border-radius:10px;
font-weight:bold;
font-size:18px;
backdrop-filter:blur(6px);
}

.ovLong{
background:#16a34acc;
}

.ovShort{
background:#dc2626cc;
}

.ovNeutral{
background:#facc15cc;
color:black;
}

/* MOBILE */

@media(max-width:900px){

.main{
flex-direction:column;
overflow:auto;
height:auto;
}

.left,
.center,
.right{
width:100%;
height:auto;
min-height:300px;
}

.center{
height:500px;
}

}

</style>
</head>

<body>

<div class="topbar">

<div class="logo">
AI SIGNAL TERMINAL
</div>

<div id="topPair">
BTCUSDT
</div>

</div>

<div class="main">

<!-- LEFT -->

<div class="left">

<h3 style="margin-bottom:14px;">
MARKETS
</h3>

<div class="pair activePair" onclick="changePair('BTCUSDT',this)">
BTCUSDT
</div>

<div class="pair" onclick="changePair('ETHUSDT',this)">
ETHUSDT
</div>

<div class="pair" onclick="changePair('SOLUSDT',this)">
SOLUSDT
</div>

<div class="pair" onclick="changePair('XRPUSDT',this)">
XRPUSDT
</div>

<div class="pair" onclick="changePair('SUIUSDT',this)">
SUIUSDT
</div>

</div>

<!-- CENTER -->

<div class="center">

<div id="overlaySignal" class="overlaySignal ovNeutral">
NEUTRAL
</div>

<div id="tvchart" style="width:100%;height:100%;"></div>

</div>

<!-- RIGHT -->

<div class="right">

<div id="mainSignal" class="signal neutral">
NEUTRAL
</div>

<!-- LIGHTS -->

<div class="lightBox">

<h3>MULTI TF SIGNALS</h3>

<div class="lightRow">
<span>1H</span>
<div id="l1h" class="light yellow"></div>
</div>

<div class="lightRow">
<span>4H</span>
<div id="l4h" class="light yellow"></div>
</div>

<div class="lightRow">
<span>1D</span>
<div id="l1d" class="light yellow"></div>
</div>

</div>

<!-- INFO -->

<div class="info">

<div class="row">
<span>ENTRY</span>
<span id="entry">--</span>
</div>

<div class="row">
<span>TP</span>
<span id="tp">--</span>
</div>

<div class="row">
<span>SL</span>
<span id="sl">--</span>
</div>

<div class="row">
<span>RSI</span>
<span id="rsi">--</span>
</div>

<div class="row">
<span>STATUS</span>
<span id="status">WAIT</span>
</div>

</div>

<!-- CONFIDENCE -->

<div class="info">

<div class="row">
<span>CONFIDENCE</span>
<span id="confText">50%</span>
</div>

<div class="barWrap">
<div id="bar" class="bar"></div>
</div>

</div>

</div>

</div>

<script>

let currentPair = "BTCUSDT";
let widget;

/* CREATE CHART */

function loadChart(pair){

document.getElementById("tvchart").innerHTML="";

widget = new TradingView.widget({

container_id:"tvchart",

width:"100%",
height:"100%",

symbol:"BINANCE:"+pair,

interval:"30",

theme:"dark",

style:"1",

hide_top_toolbar:false,

hide_legend:false,

save_image:false

});

}

/* INITIAL */

loadChart(currentPair);

/* CHANGE PAIR */

function changePair(pair,el){

currentPair = pair;

document.getElementById("topPair").innerText = pair;

document.querySelectorAll(".pair").forEach(p=>{

p.classList.remove("activePair");

});

el.classList.add("activePair");

loadChart(pair);

update();

}

/* FETCH */

async function getData(tf){

let r = await fetch(

`https://api.binance.com/api/v3/klines?symbol=${currentPair}&interval=${tf}&limit=60`

);

let d = await r.json();

return d.map(x=>parseFloat(x[4]));

}

/* RSI */

function calcRSI(data){

let gains = 0;
let losses = 0;

for(let i=1;i<data.length;i++){

let diff = data[i]-data[i-1];

if(diff>0){
gains += diff;
}else{
losses += Math.abs(diff);
}

}

let rs = gains/(losses || 1);

return 100 - (100/(1+rs));

}

/* SIGNAL */

function getSignal(rsi){

if(rsi<35) return "LONG";

if(rsi>65) return "SHORT";

return "NEUTRAL";

}

/* LIGHT */

function setLight(id,signal){

let el=document.getElementById(id);

el.className="light";

if(signal=="LONG"){
el.classList.add("green");
}

else if(signal=="SHORT"){
el.classList.add("red");
}

else{
el.classList.add("yellow");
}

}

/* MAIN UI */

function updateUI(signal,price,rsi){

let box=document.getElementById("mainSignal");

box.className="signal";

if(signal=="LONG"){
box.classList.add("long");
}

else if(signal=="SHORT"){
box.classList.add("short");
}

else{
box.classList.add("neutral");
}

box.innerText=signal;

/* OVERLAY */

let ov=document.getElementById("overlaySignal");

ov.className="overlaySignal";

if(signal=="LONG"){
ov.classList.add("ovLong");
}

else if(signal=="SHORT"){
ov.classList.add("ovShort");
}

else{
ov.classList.add("ovNeutral");
}

ov.innerText=signal;

/* PRICE */

document.getElementById("entry").innerText=price.toFixed(2);

/* TP SL */

if(signal=="LONG"){

document.getElementById("tp").innerText=(price*1.02).toFixed(2);

document.getElementById("sl").innerText=(price*0.99).toFixed(2);

}

else if(signal=="SHORT"){

document.getElementById("tp").innerText=(price*0.98).toFixed(2);

document.getElementById("sl").innerText=(price*1.01).toFixed(2);

}

else{

document.getElementById("tp").innerText="--";

document.getElementById("sl").innerText="--";

}

/* RSI */

document.getElementById("rsi").innerText=rsi.toFixed(2);

document.getElementById("status").innerText=signal;

/* CONFIDENCE */

let conf=Math.min(100,Math.abs(rsi-50)*2);

document.getElementById("confText").innerText=Math.floor(conf)+"%";

document.getElementById("bar").style.width=conf+"%";

}

/* UPDATE */

async function update(){

let d1 = await getData("1h");
let d4 = await getData("4h");
let dD = await getData("1d");

let r1 = calcRSI(d1);
let r4 = calcRSI(d4);
let rD = calcRSI(dD);

let s1 = getSignal(r1);
let s4 = getSignal(r4);
let sD = getSignal(rD);

/* LIGHTS */

setLight("l1h",s1);

setLight("l4h",s4);

setLight("l1d",sD);

/* MAIN = 4H */

let price=d4[d4.length-1];

updateUI(s4,price,r4);

}

/* START */

update();

setInterval(update,10000);

</script>

</body>
</html>
