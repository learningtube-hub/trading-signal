<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>AI SIGNAL TERMINAL</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>

/* MOBILE MARKET DROPDOWN FIX */

@media(max-width:900px){

/* LEFT PANEL SMALL */

.left{
display:block !important;
width:100% !important;
height:auto !important;
padding:10px !important;
margin-bottom:10px;
}

/* MARKET HEADER */

.marketHeader{
background:#111827;
padding:14px;
border-radius:12px;
font-size:16px;
font-weight:bold;
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
}

/* PAIR LIST */

.marketList{
margin-top:10px;
display:none;
animation:fadeDown .3s ease;
}

/* SHOW */

.marketList.show{
display:block;
}

/* ANIMATION */

@keyframes fadeDown{

0%{
opacity:0;
transform:translateY(-10px);
}

100%{
opacity:1;
transform:translateY(0);
}

}

}

</style>
</head>

<body>

<!-- LEFT PANEL -->

<div class="left">

<!-- MOBILE MARKET BUTTON -->

<div class="marketHeader" onclick="toggleMarket()">

<span>
MARKETS
</span>

<span id="marketArrow">
▼
</span>

</div>

<!-- MARKET LIST -->

<div class="marketList" id="marketList">

<div class="pair activePair"
onclick="selectPair('BTCUSDT',this)">
BTCUSDT
</div>

<div class="pair"
onclick="selectPair('ETHUSDT',this)">
ETHUSDT
</div>

<div class="pair"
onclick="selectPair('SOLUSDT',this)">
SOLUSDT
</div>

<div class="pair"
onclick="selectPair('XRPUSDT',this)">
XRPUSDT
</div>

<div class="pair"
onclick="selectPair('SUIUSDT',this)">
SUIUSDT
</div>

</div>

</div>

<script>

/* TOGGLE */

function toggleMarket(){

let list=document.getElementById("marketList");

let arrow=document.getElementById("marketArrow");

list.classList.toggle("show");

/* ARROW */

if(list.classList.contains("show")){

arrow.innerText="▲";

}else{

arrow.innerText="▼";

}

}

/* SELECT */

function selectPair(pair,el){

/* CHANGE */

changePair(pair,el);

/* AUTO HIDE */

document.getElementById("marketList")
.classList.remove("show");

document.getElementById("marketArrow")
.innerText="▼";

}

</script>

</body>
</html>
