<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRO TRADING SYSTEM v5</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

/* RESPONSIVE WRAPPER */
.wrapper{
display:flex;
flex-direction:row;
height:100vh;
}

/* MOBILE STACK */
@media (max-width: 900px){
.wrapper{
flex-direction:column;
}
.left,.right{
width:100%!important;
height:50%;
}
}

/* CHART SIDE */
.left{
width:60%;
position:relative;
border-right:1px solid #1f2937;
}

/* DASHBOARD */
.right{
width:40%;
padding:12px;
overflow:auto;
background:#0f172a;
}

/* SIGNAL BOX */
.signal{
padding:16px;
text-align:center;
font-size:22px;
font-weight:bold;
border-radius:12px;
margin-bottom:10px;
}

.buy{background:#16a34a;}
.sell{background:#dc2626;}
.wait{background:#facc15;color:black;}

/* BOX */
.box{
background:#111827;
padding:10px;
margin:8px 0;
border-radius:10px;
}

/* ROW */
.row{
display:flex;
justify-content:space-between;
margin:6px 0;
}

/* LIGHT */
.light{
width:12px;
height:12px;
border-radius:50%;
display:inline-block;
background:#555;
margin-right:6px;
}

.green{background:#22c55e;}
.red{background:#ef4444;}
.yellow{background:#facc15;}
</style>
</head>

<body>

<div class="wrapper">

<!-- CHART -->
<div class="left">
<div id="chart"></div>
</div>

<!-- DASHBOARD -->
<div class="right">

<h2>SMART PRO SYSTEM</h2>

<div id="signal" class="signal wait">WAIT</div>

<div class="box">
<div class="row"><span>Entry</span><span id="entry">--</span></div>
<div class="row"><span>TP</span><span id="tp">--</span></div>
<div class="row"><span>SL</span><span id="sl">--</span></div>
</div>

<div class="box">
<div class="row"><span>RSI 4H</span><span id="rsi">--</span></div>
<div class="row"><span>Trend</span><span id="trend">--</span></div>
<div class="row"><span>Momentum</span><span id="momentum">--</span></div>
</div>

<div class="box">
<span class="light" id="light"></span>
<span id="statusText">SYSTEM READY</span>
</div>

</div>

</div>

<script>

let symbol="BINANCE:BTCUSDT";

// ---------------- CHART ----------------
new TradingView.widget({
container_id:"chart",
width:"100%",
height:"100%",
symbol:symbol,
interval:"30",
theme:"dark",
style:"1"
});

// ---------------- DATA ----------------
async function getCloses(tf){
let res=await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol.replace("BINANCE:","")}&interval=${tf}&limit=50`);
let data=await res.json();
return data.map(x=>parseFloat(x[4]));
}

// ---------------- RSI ----------------
function rsi(closes){
let gain=0,loss=0;
for(let i=1;i<closes.length;i++){
let d=closes[i]-closes[i-1];
if(d>0) gain+=d;
else loss+=Math.abs(d);
}
let rs=gain/(loss||1);
return 100-(100/(1+rs));
}

// ---------------- TREND ----------------
function trend(closes){
return closes[closes.length-1] > closes[0] ? "UP" : "DOWN";
}

// ---------------- MOMENTUM ----------------
function momentum(closes){
let mid=Math.floor(closes.length/2);
let a=closes.slice(0,mid);
let b=closes.slice(mid);

let avg1=a.reduce((x,y)=>x+y)/a.length;
let avg2=b.reduce((x,y)=>x+y)/b.length;

return avg2>avg1 ? "UP" : "DOWN";
}

// ---------------- SIGNAL ENGINE (CLEAN) ----------------
function signalEngine(rsi,trend,momentum){

let score=0;

if(rsi<35) score++;
if(rsi>65) score--;

if(trend=="UP") score++;
if(trend=="DOWN") score--;

if(momentum=="UP") score++;
if(momentum=="DOWN") score--;

if(score>=2) return "BUY";
if(score<=-2) return "SELL";
return "WAIT";
}

// ---------------- UI ----------------
function ui(signal,price,rsiVal,trendVal,mom){

let box=document.getElementById("signal");

box.className="signal";

if(signal=="BUY") box.classList.add("buy");
if(signal=="SELL") box.classList.add("sell");
if(signal=="WAIT") box.classList.add("wait");

box.innerText=signal;

// ENTRY
document.getElementById("entry").innerText=price.toFixed(2);

// TP SL
if(signal=="BUY"){
document.getElementById("tp").innerText=(price*1.02).toFixed(2);
document.getElementById("sl").innerText=(price*0.99).toFixed(2);
}
else if(signal=="SELL"){
document.getElementById("tp").innerText=(price*0.98).toFixed(2);
document.getElementById("sl").innerText=(price*1.01).toFixed(2);
}
else{
document.getElementById("tp").innerText="--";
document.getElementById("sl").innerText="--";
}

// INFO
document.getElementById("rsi").innerText=rsiVal.toFixed(2);
document.getElementById("trend").innerText=trendVal;
document.getElementById("momentum").innerText=mom;

// LIGHT
let light=document.getElementById("light");
light.className="light";

if(signal=="BUY") light.classList.add("green");
else if(signal=="SELL") light.classList.add("red");
else light.classList.add("yellow");

document.getElementById("statusText").innerText="LIVE ANALYSIS";
}

// ---------------- UPDATE LOOP ----------------
async function update(){

let c4h=await getCloses("4h");

let r=rsi(c4h);
let t=trend(c4h);
let m=momentum(c4h);

let price=c4h[c4h.length-1];

let sig=signalEngine(r,t,m);

ui(sig,price,r,t,m);

}

setInterval(update,10000);

</script>

</body>
</html>
