<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TradingView SMC Simulator v4</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
display:flex;
height:100vh;
}

.left{
width:220px;
background:#111827;
padding:10px;
}

.center{
flex:1;
display:flex;
flex-direction:column;
}

.right{
width:320px;
background:#111827;
padding:10px;
overflow:auto;
}

#tv_chart{
flex:1;
}

.box{
background:#1f2937;
padding:10px;
margin:8px 0;
border-radius:10px;
}

button{
padding:8px;
margin:5px;
cursor:pointer;
}

.green{color:#22c55e;}
.red{color:#ef4444;}
.yellow{color:#facc15;}
</style>
</head>

<body>

<div class="left">
<h3>MARKET</h3>

<button onclick="setSymbol('BINANCE:BTCUSDT')">BTC</button>
<button onclick="setSymbol('BINANCE:ETHUSDT')">ETH</button>
<button onclick="setSymbol('BINANCE:SOLUSDT')">SOL</button>

<div class="box">
Signal: <span id="signal">WAIT</span>
</div>

<button onclick="openTrade('BUY')">BUY</button>
<button onclick="openTrade('SELL')">SELL</button>
<button onclick="closeTrade()">CLOSE</button>

</div>

<div class="center">
<div id="tv_chart"></div>
</div>

<div class="right">

<div class="box">
Balance: <span id="balance">1000</span>
</div>

<div class="box">
Position: <span id="position">NONE</span>
</div>

<div class="box">
PnL: <span id="pnl">0</span>
</div>

<div class="box">
RSI: <span id="rsi">--</span>
</div>

<h3>History</h3>
<div id="history"></div>

</div>

<script>

let symbol="BINANCE:BTCUSDT";

let balance=1000;
let position=null;
let entryPrice=0;
let pnl=0;

let feeRate=0.001;

let rsi=50;
let price=0;

// ---------------- CHART ----------------

function loadChart(sym){
document.getElementById("tv_chart").innerHTML="";

new TradingView.widget({
container_id:"tv_chart",
width:"100%",
height:"100%",
symbol:sym,
interval:"5",
theme:"dark",
style:"1"
});
}

// ---------------- RSI (SIMULATED FROM PRICE MOVEMENT FEEL) ----------------

function fakeRSI(){
rsi = 30 + Math.random()*50;
document.getElementById("rsi").innerText=rsi.toFixed(2);

if(rsi<40){
document.getElementById("signal").innerText="BUY";
}
else if(rsi>65){
document.getElementById("signal").innerText="SELL";
}
else{
document.getElementById("signal").innerText="NEUTRAL";
}
}

// ---------------- TRADING ----------------

function openTrade(type){

if(position){
alert("Close first!");
return;
}

position=type;
entryPrice=rsi; // proxy logic (since no real tick API)

balance -= balance*feeRate;

log("OPEN "+type+" | fee deducted");
updateUI();
}

function closeTrade(){

if(!position) return;

let profit=(rsi-entryPrice);

if(position=="SELL") profit=-profit;

balance += profit;
pnl += profit;

log("CLOSE "+position+" | PnL: "+profit.toFixed(2));

position=null;
entryPrice=0;

updateUI();
}

function updateUI(){
document.getElementById("balance").innerText=balance.toFixed(2);
document.getElementById("pnl").innerText=pnl.toFixed(2);
document.getElementById("position").innerText=position?position:"NONE";
}

function log(msg){
let d=document.createElement("div");
d.innerHTML=msg;
document.getElementById("history").prepend(d);
}

// ---------------- MAIN LOOP ----------------

function loop(){
fakeRSI();
updateUI();
}

function setSymbol(s){
symbol=s;
loadChart(symbol);
}

loadChart(symbol);

setInterval(loop,3000);

</script>

</body>
</html>
