<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRO TRADING SIGNAL TERMINAL</title>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
  background:#0b1220;
  color:#e5e7eb;
  height:100vh;
  display:flex;
}

/* LEFT PANEL */
.left{
  width:220px;
  background:#0f172a;
  border-right:1px solid #1f2937;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.logo{
  font-size:18px;
  font-weight:bold;
  color:#38bdf8;
  padding:8px;
}

.pair{
  padding:10px;
  background:#111827;
  border-radius:8px;
  cursor:pointer;
  text-align:center;
}

.pair:hover{background:#1f2937;}

/* CENTER */
.center{
  flex:1;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:55px;
  background:#0f172a;
  border-bottom:1px solid #1f2937;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
}

.chartBox{
  flex:1;
  margin:10px;
  border-radius:12px;
  border:1px solid #1f2937;
  overflow:hidden;
}

/* RIGHT */
.right{
  width:280px;
  background:#0f172a;
  border-left:1px solid #1f2937;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.card{
  background:#111827;
  padding:12px;
  border-radius:12px;
}

.btnRow{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.btn{
  flex:1;
  padding:10px;
  border:none;
  border-radius:20px;
  font-weight:bold;
  cursor:pointer;
  color:white;
}

.green{background:#22c55e;}
.red{background:#ef4444;}

.tp{color:#22c55e;font-weight:bold;margin-top:5px;}
.sl{color:#ef4444;font-weight:bold;}
.entry{color:#38bdf8;font-weight:bold;}
.status{margin-top:8px;}
</style>
</head>

<body>

<!-- LEFT -->
<div class="left">
  <div class="logo">TRADE TERMINAL PRO</div>
  <div class="pair" onclick="setPair('BTCUSDT')">BTC/USDT</div>
  <div class="pair" onclick="setPair('ETHUSDT')">ETH/USDT</div>
  <div class="pair" onclick="setPair('SOLUSDT')">SOL/USDT</div>
  <div class="pair" onclick="setPair('BNBUSDT')">BNB/USDT</div>
</div>

<!-- CENTER -->
<div class="center">
  <div class="topbar">
    <div id="title">BTC/USDT LIVE TERMINAL</div>
    <div id="livePrice">PRICE: --</div>
  </div>
  <div class="chartBox" id="tv"></div>
</div>

<!-- RIGHT -->
<div class="right">

  <div class="card">
    <h3>SIGNAL ENGINE</h3>
    <div class="entry" id="entry">ENTRY: --</div>
    <div class="tp" id="tp">TP: --</div>
    <div class="sl" id="sl">SL: --</div>

    <div class="btnRow">
      <button class="btn green" onclick="manual('LONG')">LONG</button>
      <button class="btn red" onclick="manual('SHORT')">SHORT</button>
    </div>

    <div class="status" id="status">WAITING SIGNAL...</div>
  </div>

</div>

<script>
let symbol="BTCUSDT";
let price=65000;

function loadChart(sym){
  document.getElementById("tv").innerHTML="";

  new TradingView.widget({
    width:"100%",
    height:"100%",
    symbol:"BINANCE:"+sym,
    interval:"1",
    theme:"dark",
    style:"1",
    container_id:"tv"
  });

  document.getElementById("title").innerText=sym+" TERMINAL";
}

async function fetchPrice(){
  try{
    let res=await fetch("https://api.binance.com/api/v3/ticker/price?symbol="+symbol);
    let data=await res.json();
    price=parseFloat(data.price);

    document.getElementById("livePrice").innerText="PRICE: "+price;
  }catch(e){}
}

function signal(type){
  let entry=price;
  let tp,sl;

  if(type=="LONG"){
    tp=entry+300;
    sl=entry-200;
  }else{
    tp=entry-300;
    sl=entry+200;
  }

  document.getElementById("entry").innerText="ENTRY: "+entry;
  document.getElementById("tp").innerText="TP: "+tp;
  document.getElementById("sl").innerText="SL: "+sl;

  document.getElementById("status").innerText=type+" ACTIVE";
  document.getElementById("status").style.color=type=="LONG"?"#22c55e":"#ef4444";
}

function autoSignal(){
  let r=Math.random();
  if(r>0.5) signal("LONG"); else signal("SHORT");
}

function setPair(p){
  symbol=p;
  loadChart(p);
}

function manual(t){
  signal(t);
}

window.onload=function(){
  loadChart(symbol);
  fetchPrice();
  autoSignal();

  setInterval(fetchPrice,3000);
  setInterval(autoSignal,5000);
};
</script>

</body>
</html>
