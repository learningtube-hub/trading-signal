<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signals Dashboard</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
    body{background:#f4f6f9;display:flex;min-height:100vh;}

    /* Sidebar */
    .sidebar{
      width:260px;background:#0f172a;color:#fff;padding:20px;
    }
    .logo{font-size:20px;font-weight:bold;margin-bottom:30px;}
    .nav a{
      display:block;color:#cbd5e1;text-decoration:none;padding:12px 10px;
      border-radius:8px;margin-bottom:8px;
    }
    .nav a:hover,.nav a.active{background:#1e293b;color:#fff;}

    /* Main */
    .main{flex:1;padding:20px;}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}

    /* Table */
    table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;}
    th,td{padding:12px;border-bottom:1px solid #eee;text-align:left;font-size:14px;}
    th{background:#f1f5f9;}

    .btn{padding:6px 10px;border:none;border-radius:6px;cursor:pointer;}
    .view{background:#2563eb;color:#fff;}

    .status-active{color:green;font-weight:bold;}
    .status-hit{color:orange;font-weight:bold;}
    .status-expired{color:gray;font-weight:bold;}

    /* Modal */
    .modal{
      display:none;position:fixed;top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,0.5);justify-content:center;align-items:center;
    }
    .modal-content{
      background:#fff;width:800px;max-width:95%;padding:20px;border-radius:10px;
    }
    .close{float:right;cursor:pointer;font-size:18px;}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px;}
    .card{background:#f8fafc;padding:12px;border-radius:8px;}
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="logo">Trade Panel</div>
    <div class="nav">
      <a class="active" href="#">Dashboard</a>
      <a href="#">Profile</a>
      <a href="#">Signals</a>
      <a href="#">Wallet</a>
      <a href="#">History</a>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <h2>Signals</h2>
    </div>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Pair</th>
          <th>Type</th>
          <th>Entry</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>XAUUSD</td>
          <td>BUY</td>
          <td>2345.50</td>
          <td class="status-active">Active</td>
          <td><button class="btn view" onclick="openModal('XAUUSD')">View Details</button></td>
        </tr>
        <tr>
          <td>2</td>
          <td>EURUSD</td>
          <td>SELL</td>
          <td>1.08250</td>
          <td class="status-hit">Hit TP</td>
          <td><button class="btn view" onclick="openModal('EURUSD')">View Details</button></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2 id="title">Signal Details</h2>

      <div class="grid">
        <div class="card">
          <h4>Trade Info</h4>
          <p>Pair: <span id="pair"></span></p>
          <p>Entry: 2345.50</p>
          <p>TP: 2360.00</p>
          <p>SL: 2330.00</p>
        </div>

        <div class="card">
          <h4>Status</h4>
          <p id="statusText">Active</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    function openModal(pair){
      document.getElementById('modal').style.display='flex';
      document.getElementById('pair').innerText=pair;
      document.getElementById('title').innerText=pair + ' Signal Details';
    }

    function closeModal(){
      document.getElementById('modal').style.display='none';
    }
  </script>

</body>
</html>
