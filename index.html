<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pro Trading Login System</title>
<script src="https://cdn.tailwindcss.com"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>

</head>

<body class="bg-gray-900 text-white">

<!-- LOGIN SCREEN -->
<div id="auth" class="flex flex-col items-center justify-center h-screen">

<h1 class="text-2xl text-green-400 mb-4">AI Trading Login</h1>

<input id="email" placeholder="Email" class="p-2 text-black mb-2 rounded">
<input id="pass" type="password" placeholder="Password" class="p-2 text-black mb-2 rounded">

<button onclick="signup()" class="bg-green-500 px-4 py-2 m-1 rounded">Register</button>
<button onclick="login()" class="bg-blue-500 px-4 py-2 m-1 rounded">Login</button>

</div>

<!-- DASHBOARD -->
<div id="app" class="hidden">

<!-- NAV -->
<div class="bg-gray-800 p-4 flex justify-between">
<button onclick="showHome()">Home</button>
<button onclick="showProfile()">Profile</button>
<button onclick="logout()" class="text-red-400">Logout</button>
</div>

<!-- HOME -->
<div id="home" class="p-6">

<h2 class="text-2xl text-green-400">Dashboard</h2>

<div class="mt-4 grid md:grid-cols-3 gap-4">

<div class="bg-gray-800 p-4 rounded">BTC: BUY 📈</div>
<div class="bg-gray-800 p-4 rounded">ETH: SELL 📉</div>
<div class="bg-gray-800 p-4 rounded">BNB: HOLD ⚪</div>

</div>

</div>

<!-- PROFILE -->
<div id="profile" class="hidden p-6">

<h2 class="text-xl">User Profile</h2>

<p>Email: <span id="userEmail"></span></p>
<p>Status: Free User</p>

</div>

</div>

<script>

// --- FIREBASE CONFIG (replace later if needed)
const firebaseConfig = {
apiKey: "YOUR_KEY",
authDomain: "YOUR_DOMAIN",
projectId: "YOUR_PROJECT"
};

// init
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// SIGNUP
function signup(){
let email = document.getElementById("email").value;
let pass = document.getElementById("pass").value;

auth.createUserWithEmailAndPassword(email, pass)
.then(user=>{
alert("Registered");
})
.catch(err=>alert(err.message));
}

// LOGIN
function login(){
let email = document.getElementById("email").value;
let pass = document.getElementById("pass").value;

auth.signInWithEmailAndPassword(email, pass)
.then(user=>{
document.getElementById("auth").style.display="none";
document.getElementById("app").style.display="block";
document.getElementById("userEmail").innerText = email;
})
.catch(err=>alert(err.message));
}

// LOGOUT
function logout(){
auth.signOut().then(()=>{
location.reload();
});
}

// NAV
function showHome(){
document.getElementById("home").style.display="block";
document.getElementById("profile").style.display="none";
}

function showProfile(){
document.getElementById("home").style.display="none";
document.getElementById("profile").style.display="block";
}

</script>

</body>
</html>
