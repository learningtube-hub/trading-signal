<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PRO TRADING DASHBOARD v3</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
height:100vh;
display:flex;
}

/* LEFT = CHART (50%) */
.left{
width:50%;
position:relative;
border-right:1px solid #1f2937;
}

/* RIGHT = DASHBOARD */
.right{
width:50%;
padding:12px;
overflow:auto;
background:#0f172a;
}

/* TOP SIGNAL BAR */
.topBar{
position:absolute;
top:10px;
left:10px;
z-index:10;
display:flex;
gap:10px;
}

.light{
width:14px;
height:14px;
border-radius:50%;
background:#555;
}

.green{background:#22c55e; animation:blink 1s infinite;}
.red{background:#ef4444; animation:blink 1s infinite;}
.yellow{background:#facc15; animation:blink 1s infinite;}

@keyframes blink{
50%{opacity:0.3;}
}

/* BOX */
.box{
background:#111827;
padding:10px;
margin:8px 0;
border-radius:10px;
}

/* SIGNAL CARD */
.signalCard{
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
border-radius:12px;
}

.buy{background:#16a34a;}
.sell{background:#dc2626;}
.wait{background:#facc15;color:black;}

.row{
display:flex;
justify-content:space-between;
margin:6px 0;
}

#chart{
width:100%;
height:100vh;
}
</style>
</head>

<body>

<!-- LEFT: CHART -->
<div class="left">

<!-- TOP LIGHT BAR -->
<div class="topBar">
<div id="l1" class="light"></div>
<div id="l2" class="light"></div>
<div id="l3" class="light"></div>
</div>

<div id="chart"></div>

</div>

<!-- RIGHT: DASHBOARD -->
<div class="right">

<h2>SMART DASHBOARD</h2>

<div id="signal" class="signalCard wait">WAIT</div>

<div class="box">
<div class="row"><span>Entry</span><span id="entry">--</span></div>
<div class="row"><span>TP</span><span id="tp">--</span></div>
<div class="row"><span>SL</span><span id="sl">--</span></div>
</div>

<div class="box">
<div class="row"><span>RSI 30M</span><span id="r30">--</span></div>
<div class="row"><span>RSI 1H</span><span id="r1h">--</span></div>
<div class="row"><span>RSI 4H</span><span id="r4h">--</span></div>
<div class="row"><span>RSI 1D</span><span id="r1d">--</span></div>
</div>

</div>

<script>

let symbol="BINANCE:BTCUSDT";

// ---------------- CHART ----------------
new TradingView.widget({
container_id:"chart",
width:"100%",
height:"100%",
symbol:symbol,
interval:"30",
theme:"dark",
style:"1"
});

// ---------------- FETCH ----------------
async function getCloses(tf){
let res=await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol.replace("BINANCE:","")}&interval=${tf}&limit=50`);
let data=await res.json();
return data.map(x=>parseFloat(x[4]));
}

// ---------------- RSI ----------------
function calcRSI(closes){
let gain=0,loss=0;
for(let i=1;i<closes.length;i++){
let d=closes[i]-closes[i-1];
if(d>0) gain+=d;
else loss+=Math.abs(d);
}
let rs=gain/(loss||1);
return 100-(100/(1+rs));
}

// ---------------- SIGNAL ----------------
function getSignal(rsi){
if(rsi<35) return "BUY";
if(rsi>65) return "SELL";
return "WAIT";
}

// ---------------- LIGHT CONTROL ----------------
function setLights(signal){

let l1=document.getElementById("l1");
let l2=document.getElementById("l2");
let l3=document.getElementById("l3");

l1.className="light";
l2.className="light";
l3.className="light";

if(signal=="BUY"){
l1.classList.add("green");
}
else if(signal=="SELL"){
l1.classList.add("red");
}
else{
l1.classList.add("yellow");
}
}

// ---------------- UI ----------------
function updateUI(signal,price,rsi){

let box=document.getElementById("signal");
box.innerText=signal;

box.className="signalCard ";

if(signal=="BUY") box.classList.add("buy");
if(signal=="SELL") box.classList.add("sell");
if(signal=="WAIT") box.classList.add("wait");

// entry
document.getElementById("entry").innerText=price.toFixed(2);

// TP SL
if(signal=="BUY"){
document.getElementById("tp").innerText=(price*1.02).toFixed(2);
document.getElementById("sl").innerText=(price*0.99).toFixed(2);
}
else if(signal=="SELL"){
document.getElementById("tp").innerText=(price*0.98).toFixed(2);
document.getElementById("sl").innerText=(price*1.01).toFixed(2);
}
else{
document.getElementById("tp").innerText="--";
document.getElementById("sl").innerText="--";
}

}

// ---------------- UPDATE LOOP ----------------
async function update(){

let c4h=await getCloses("4h");
let price=c4h[c4h.length-1];

let r30=calcRSI(await getCloses("30m"));
let r1h=calcRSI(await getCloses("1h"));
let r4h=calcRSI(c4h);
let r1d=calcRSI(await getCloses("1d"));

let signal=getSignal(r4h);

setLights(signal);
updateUI(signal,price,r4h);

// RSI UI
document.getElementById("r30").innerText=r30.toFixed(2);
document.getElementById("r1h").innerText=r1h.toFixed(2);
document.getElementById("r4h").innerText=r4h.toFixed(2);
document.getElementById("r1d").innerText=r1d.toFixed(2);

}

setInterval(update,10000);

</script>

</body>
</html>
