<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>REAL TIME SIGNAL ENGINE DASHBOARD</title>
<script src="https://s3.tradingview.com/tv.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
  background:#0b1220;
  color:#e5e7eb;
  height:100vh;
  display:flex;
  overflow:hidden;
}

.left{
  width:200px;
  background:#0f172a;
  border-right:1px solid #1f2937;
  padding:10px;
}

.pair{
  padding:10px;
  margin:6px 0;
  background:#111827;
  border-radius:8px;
  cursor:pointer;
  text-align:center;
}

.center{
  flex:1;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:50px;
  background:#0f172a;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 10px;
  border-bottom:1px solid #1f2937;
}

.chartBox{
  flex:1;
  margin:10px;
  border-radius:12px;
  border:1px solid #1f2937;
  overflow:hidden;
}

.right{
  width:280px;
  background:#0f172a;
  border-left:1px solid #1f2937;
  padding:10px;
}

.card{
  background:#111827;
  padding:12px;
  border-radius:12px;
}

.signal{
  font-size:22px;
  font-weight:bold;
  margin-top:10px;
}

.green{color:#22c55e;}
.red{color:#ef4444;}
.yellow{color:#fbbf24;}

.small{font-size:12px;opacity:0.7;}
</style>
</head>

<body>

<div class="left">
  <h3>COINS</h3>
  <div class="pair" onclick="setSymbol('BTCUSDT')">BTC</div>
  <div class="pair" onclick="setSymbol('ETHUSDT')">ETH</div>
  <div class="pair" onclick="setSymbol('SOLUSDT')">SOL</div>
</div>

<div class="center">
  <div class="topbar">
    <div id="title">SIGNAL ENGINE</div>
    <div id="price">PRICE: --</div>
  </div>

  <div class="chartBox" id="tv"></div>
</div>

<div class="right">
  <div class="card">
    <h3>AI SIGNAL</h3>
    <div id="signal" class="signal yellow">WAIT</div>
    <div class="small" id="info">Calculating indicators...</div>

    <div class="small" id="entry">ENTRY: --</div>
    <div class="small" id="tp">TP: --</div>
    <div class="small" id="sl">SL: --</div>
  </div>
</div>

<script>

let symbol="BTCUSDT";
let prices=[];
let price=0;

function loadChart(sym){
  document.getElementById("tv").innerHTML="";

  new TradingView.widget({
    width:"100%",
    height:"100%",
    symbol:"BINANCE:"+sym,
    interval:"1",
    theme:"dark",
    style:"1",
    container_id:"tv"
  });

  document.getElementById("title").innerText=sym+" SIGNAL ENGINE";
}

async function fetchPrice(){
  try{
    let res=await fetch("https://api.binance.com/api/v3/ticker/price?symbol="+symbol);
    let data=await res.json();
    price=parseFloat(data.price);

    document.getElementById("price").innerText="PRICE: "+price;

    prices.push(price);
    if(prices.length>50) prices.shift();

    runIndicator();
  }catch(e){}
}

function rsi(data, period=14){
  if(data.length<period) return 50;

  let gains=0, losses=0;

  for(let i=data.length-period;i<data.length;i++){
    let diff=data[i]-data[i-1];
    if(diff>0) gains+=diff; else losses+=Math.abs(diff);
  }

  let rs=gains/(losses||1);
  return 100-(100/(1+rs));
}

function ema(data, period){
  let k=2/(period+1);
  let arr=[data[0]];

  for(let i=1;i<data.length;i++){
    arr.push(data[i]*k + arr[i-1]*(1-k));
  }

  return arr;
}

function runIndicator(){
  if(prices.length<20) return;

  let r=rsi(prices);
  let emaS=ema(prices,9).pop();
  let emaL=ema(prices,21).pop();

  let sig="WAIT";
  let color="yellow";

  if(r<30 && emaS>emaL){
    sig="LONG";
    color="green";
  }else if(r>70 && emaS<emaL){
    sig="SHORT";
    color="red";
  }

  document.getElementById("signal").innerText=sig;
  document.getElementById("signal").className="signal "+color;

  let entry=price;
  let tp=sig=="LONG"?price*1.002:price*0.998;
  let sl=sig=="LONG"?price*0.999:price*1.001;

  document.getElementById("entry").innerText="ENTRY: "+entry.toFixed(2);
  document.getElementById("tp").innerText="TP: "+tp.toFixed(2);
  document.getElementById("sl").innerText="SL: "+sl.toFixed(2);

  document.getElementById("info").innerText="RSI + EMA SIGNAL ENGINE RUNNING";
}

function setSymbol(s){
  symbol=s;
  prices=[];
  loadChart(s);
}

window.onload=function(){
  loadChart(symbol);
  fetchPrice();
  setInterval(fetchPrice,3000);
};

</script>

</body>
</html>
