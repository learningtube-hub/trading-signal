<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crypto Signal Dashboard Pro</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

header {
  padding:20px;
  background:#111827;
}

.container {
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:15px;
  padding:20px;
}

.card {
  background:#1e293b;
  padding:15px;
  border-radius:10px;
}

.buy { color: #00ff88; font-weight:bold; }
.sell { color: #ff4d4d; font-weight:bold; }

.badge {
  padding:5px 10px;
  border-radius:8px;
  background:#334155;
  display:inline-block;
  margin-top:5px;
}

.paid {
  background: gold;
  color:black;
  padding:5px 10px;
  border-radius:8px;
}

.free {
  background: #22c55e;
  padding:5px 10px;
  border-radius:8px;
}
</style>
</head>

<body>

<header>
  <h1>Crypto Signal Dashboard</h1>
  <p>Live Long / Short Signals (Free + Paid System Ready)</p>
</header>

<div id="status" class="badge free">FREE MODE</div>

<div class="container">

  <div class="card" id="BTCUSDT">Loading BTC...</div>
  <div class="card" id="ETHUSDT">Loading ETH...</div>
  <div class="card" id="BNBUSDT">Loading BNB...</div>
  <div class="card" id="XRPUSDT">Loading XRP...</div>
  <div class="card" id="SOLUSDT">Loading SOL...</div>
  <div class="card" id="ADAUSDT">Loading ADA...</div>

</div>

<script>
// ====== CONFIG ======
const pairs = ["BTCUSDT","ETHUSDT","BNBUSDT","XRPUSDT","SOLUSDT","ADAUSDT"];

// demo base prices
let basePrices = {
  BTCUSDT: 65000,
  ETHUSDT: 3200,
  BNBUSDT: 580,
  XRPUSDT: 0.6,
  SOLUSDT: 140,
  ADAUSDT: 0.5
};

// ====== SIGNAL ENGINE ======
function getSignal(price, base) {
  if (price > base) return "BUY";
  else return "SELL";
}

// ====== UPDATE UI ======
function updateUI() {

  pairs.forEach(pair => {

    // fake live movement (demo)
    let change = (Math.random() * 200 - 100);
    let price = basePrices[pair] + change;

    let signal = getSignal(price, basePrices[pair]);

    document.getElementById(pair).innerHTML = `
      <h2>${pair}</h2>
      <p>Price: ${price.toFixed(2)}</p>
      <p class="${signal === 'BUY' ? 'buy' : 'sell'}">
        Signal: ${signal}
      </p>
      <p>Entry: ${price.toFixed(2)}</p>
      <p>TP: ${(price * 1.03).toFixed(2)}</p>
      <p>SL: ${(price * 0.97).toFixed(2)}</p>
      <div class="badge">ACTIVE</div>
    `;
  });
}

// ====== AUTO UPDATE ======
updateUI();
setInterval(updateUI, 5000);

// ====== FUTURE BACKEND HOOK ======
async function fetchFromBackend() {
  // এখানে পরে তোমার real API বসবে
  // const res = await fetch(API_URL);
}
</script>

</body>
</html>
