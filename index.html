<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pro Trading Dashboard</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0f1a;
  color:white;
}

/* TOP BAR */
.topbar{
  height:60px;
  background:#0f172a;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid #1f2937;
}

.logo{
  font-weight:bold;
  color:#00ffcc;
  font-size:18px;
}

/* LAYOUT */
.container{
  display:flex;
  height:calc(100vh - 60px);
}

/* LEFT PANEL */
.left{
  width:220px;
  background:#0f172a;
  padding:10px;
  border-right:1px solid #1f2937;
}

.asset{
  padding:10px;
  margin:5px 0;
  background:#1e293b;
  border-radius:6px;
  cursor:pointer;
}

.asset:hover{
  background:#334155;
}

/* CENTER */
.center{
  flex:1;
  padding:10px;
}

.chart{
  height:100%;
  background:#111827;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#888;
  font-size:18px;
}

/* RIGHT */
.right{
  width:320px;
  background:#0f172a;
  padding:10px;
  border-left:1px solid #1f2937;
}

.card{
  background:#111827;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
}

.green{color:#00ff88;font-weight:bold;}
.red{color:#ff4d4d;font-weight:bold;}
.yellow{color:#facc15;font-weight:bold;}

.status{
  padding:6px 10px;
  background:#f59e0b;
  border-radius:6px;
  display:inline-block;
}

/* BUTTON */
button{
  width:100%;
  padding:10px;
  margin-top:8px;
  background:#2563eb;
  border:none;
  color:white;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:#1d4ed8;
}
</style>
</head>

<body>

<!-- TOP -->
<div class="topbar">
  <div class="logo">⚡ MAGIC TRADE AI</div>
  <div>
    <button style="width:auto;padding:8px 12px;">Login</button>
    <button style="width:auto;padding:8px 12px;background:#10b981;">Register</button>
  </div>
</div>

<!-- BODY -->
<div class="container">

<!-- LEFT -->
<div class="left">
<h3>MARKETS</h3>

<div class="asset">BTCUSDT</div>
<div class="asset">ETHUSDT</div>
<div class="asset">BNBUSDT</div>
<div class="asset">XRPUSDT</div>

</div>

<!-- CENTER -->
<div class="center">
<div class="chart">
📊 TradingView Chart Area (Live Chart Here)
</div>
</div>

<!-- RIGHT -->
<div class="right">

<div class="card">
<div class="status">WAITING FOR SIGNAL</div>
</div>

<div class="card">
<p>Signal: <span class="yellow">NEUTRAL</span></p>
<p>RSI: 52.10</p>
<p>Trend: SIDEWAYS</p>
</div>

<div class="card">
<p class="green">LONG ZONE</p>
<p>Entry: ----</p>
<p>TP: ----</p>
<p>SL: ----</p>
</div>

<div class="card">
<p class="red">SHORT ZONE</p>
<p>Entry: ----</p>
<p>TP: ----</p>
<p>SL: ----</p>
</div>

<button>SCAN MARKET</button>

</div>

</div>

</body>
</html>
