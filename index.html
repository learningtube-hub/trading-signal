<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pro TradingView Dashboard</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

    body{
      background:#0b1220;
      color:white;
      height:100vh;
      display:flex;
      overflow:hidden;
    }

    .sidebar{
      width:260px;
      background:#0f172a;
      padding:15px;
      display:flex;
      flex-direction:column;
      gap:10px;
      border-right:1px solid #1f2937;
    }

    .logo{
      font-size:20px;
      font-weight:bold;
      color:#38bdf8;
      margin-bottom:10px;
    }

    .menu{
      padding:10px;
      background:#111827;
      border-radius:8px;
      cursor:pointer;
    }

    .menu:hover{background:#1f2937;}

    .main{
      flex:1;
      display:flex;
      flex-direction:column;
    }

    .topbar{
      height:60px;
      background:#0f172a;
      border-bottom:1px solid #1f2937;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 15px;
    }

    .title{
      font-weight:bold;
    }

    .content{
      flex:1;
      display:flex;
    }

    .chart{
      flex:1;
    }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="logo">TRADE PRO LIVE</div>
  <div class="menu">Dashboard</div>
  <div class="menu">Market</div>
  <div class="menu">Signals</div>
  <div class="menu">Portfolio</div>
</div>

<div class="main">

  <div class="topbar">
    <div class="title">BTC / USDT Live TradingView</div>
    <div>Real Market Chart</div>
  </div>

  <div class="content">
    <div class="chart" id="tv_chart"></div>
  </div>

</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

<script>
new TradingView.widget({
  "width": "100%",
  "height": "100%",
  "symbol": "BINANCE:BTCUSDT",
  "interval": "1",
  "timezone": "Asia/Dhaka",
  "theme": "dark",
  "style": "1",
  "locale": "en",
  "toolbar_bg": "#0f172a",
  "enable_publishing": false,
  "hide_top_toolbar": false,
  "container_id": "tv_chart"
});
</script>

</body>
</html>
