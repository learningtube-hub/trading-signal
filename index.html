<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SMC SIGNAL ENGINE v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
display:flex;
}

.left{
width:160px;
background:#111827;
padding:10px;
}

.center{
flex:1;
padding:10px;
}

.right{
width:340px;
background:#111827;
padding:10px;
}

.box{
background:#1f2937;
padding:10px;
margin:8px 0;
border-radius:10px;
}

.signal{
font-size:22px;
font-weight:bold;
padding:12px;
border-radius:10px;
text-align:center;
}

.green{background:#16a34a;}
.red{background:#dc2626;}
.yellow{background:#f59e0b;color:black;}

.small{font-size:12px;opacity:0.8;}
</style>
</head>

<body>

<div class="left">
<h3>MARKET</h3>
<div onclick="set('BTCUSDT')" class="box">BTC</div>
<div onclick="set('ETHUSDT')" class="box">ETH</div>
<div onclick="set('SOLUSDT')" class="box">SOL</div>
</div>

<div class="center">
<h2>SMC PRO ENGINE v2</h2>
<div class="box">Price: <span id="price">--</span></div>

<div class="box signal yellow" id="signal">WAIT</div>

<div class="box">
Score: <span id="score">0</span><br>
Trend: <span id="trend">--</span><br>
Liquidity: <span id="liq">--</span>
</div>

</div>

<div class="right">

<div class="box">
RSI 30m: <span id="r30"></span><br>
RSI 1h: <span id="r1h"></span><br>
RSI 4h: <span id="r4h"></span><br>
RSI 1D: <span id="r1d"></span><br>
RSI 1W: <span id="r1w"></span>
</div>

</div>

<script>

let symbol="BTCUSDT";
let price=0;

async function getPrice(){
let r=await fetch("https://api.binance.com/api/v3/ticker/price?symbol="+symbol);
let d=await r.json();
price=parseFloat(d.price);
document.getElementById("price").innerText=price;
}

async function getRSI(tf){
let r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${tf}&limit=50`);
let d=await r.json();
let closes=d.map(x=>parseFloat(x[4]));

let gain=0,loss=0;
for(let i=1;i<closes.length;i++){
let diff=closes[i]-closes[i-1];
if(diff>0) gain+=diff;
else loss+=Math.abs(diff);
}
let rs=gain/(loss||1);
return 100-(100/(1+rs));
}

function state(r){
if(r<30) return "OS";
if(r>70) return "OB";
return "NEUTRAL";
}

function trend(){
return price%2==0 ? "UP" : "DOWN"; // simplified structure
}

function liquidity(){
return price%3==0 ? "SWEEP" : "NORMAL"; // fake logic demo
}

async function update(){

let r30=await getRSI("30m");
let r1h=await getRSI("1h");
let r4h=await getRSI("4h");
let r1d=await getRSI("1d");
let r1w=await getRSI("1w");

document.getElementById("r30").innerText=r30.toFixed(2);
document.getElementById("r1h").innerText=r1h.toFixed(2);
document.getElementById("r4h").innerText=r4h.toFixed(2);
document.getElementById("r1d").innerText=r1d.toFixed(2);
document.getElementById("r1w").innerText=r1w.toFixed(2);

let score=0;

if(r4h<30) score++;
if(r1h<30) score++;
if(r4h>70) score--;
if(r1h>70) score--;

if(liquidity()=="SWEEP") score++;

let signal="WAIT";
let color="yellow";

if(score>=2){signal="STRONG BUY";color="green";}
if(score<=-2){signal="STRONG SELL";color="red";}

document.getElementById("score").innerText=score;
document.getElementById("trend").innerText=trend();
document.getElementById("liq").innerText=liquidity();

let box=document.getElementById("signal");
box.innerText=signal;
box.className="signal "+color;

}

function set(s){
symbol=s;
}

setInterval(getPrice,3000);
setInterval(update,10000);

</script>

</body>
</html>
