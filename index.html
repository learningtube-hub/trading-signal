<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CENTER TRADING VIEW LAYOUT</title>

<script src="https://s3.tradingview.com/tv.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1220;
color:white;
}

/* TOP BAR */
.top{
height:55px;
background:#111827;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
}

/* MAIN WRAPPER (CENTER FOCUS) */
.main{
height:calc(100vh - 55px);
display:flex;
justify-content:center;   /* 👈 CENTER FIX */
align-items:center;
gap:2%;                  /* 👈 2% SPACE BOTH SIDE */
padding:0 2%;
}

/* LEFT PANEL */
.left{
width:20%;
height:85%;
background:#0f172a;
border-radius:10px;
padding:10px;
overflow:auto;
}

/* CENTER CHART */
.center{
width:40%;
height:85%;
background:#0b1220;
border-radius:12px;
overflow:hidden;
box-shadow:0 0 20px rgba(0,0,0,0.5);
}

/* RIGHT PANEL */
.right{
width:20%;
height:85%;
background:#0f172a;
border-radius:10px;
padding:10px;
overflow:auto;
}

/* SIGNAL */
.signal{
padding:16px;
text-align:center;
font-size:20px;
font-weight:bold;
border-radius:10px;
}

.long{background:#16a34a;}
.short{background:#dc2626;}
.neutral{background:#facc15;color:black;}
</style>
</head>

<body>

<div class="top">
<b>PRO CENTER TRADER</b>
<span>BTC / REAL TIME DASHBOARD</span>
</div>

<div class="main">

<!-- LEFT -->
<div class="left">
<h3>COINS</h3>
<div>BTCUSDT</div>
<div>ETHUSDT</div>
<div>SOLUSDT</div>
</div>

<!-- CENTER -->
<div class="center">
<div id="chart"></div>
</div>

<!-- RIGHT -->
<div class="right">

<div id="signal" class="signal neutral">NEUTRAL</div>

<p>Entry: <span id="entry">--</span></p>
<p>TP: <span id="tp">--</span></p>
<p>SL: <span id="sl">--</span></p>

<p>RSI: <span id="rsi">--</span></p>

</div>

</div>

<script>

new TradingView.widget({
container_id:"chart",
width:"100%",
height:"100%",
symbol:"BINANCE:BTCUSDT",
interval:"30",
theme:"dark",
style:"1"
});

async function getData(){
let r=await fetch("https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=4h&limit=50");
let d=await r.json();
return d.map(x=>parseFloat(x[4]));
}

function rsi(data){
let g=0,l=0;
for(let i=1;i<data.length;i++){
let d=data[i]-data[i-1];
if(d>0) g+=d;
else l+=Math.abs(d);
}
let rs=g/(l||1);
return 100-(100/(1+rs));
}

function signal(r){
if(r<35) return "LONG";
if(r>65) return "SHORT";
return "NEUTRAL";
}

function ui(sig,price,r){

let box=document.getElementById("signal");
box.className="signal";

if(sig=="LONG") box.classList.add("long");
if(sig=="SHORT") box.classList.add("short");
if(sig=="NEUTRAL") box.classList.add("neutral");

box.innerText=sig;

document.getElementById("entry").innerText=price.toFixed(2);

if(sig=="LONG"){
document.getElementById("tp").innerText=(price*1.02).toFixed(2);
document.getElementById("sl").innerText=(price*0.99).toFixed(2);
}
else if(sig=="SHORT"){
document.getElementById("tp").innerText=(price*0.98).toFixed(2);
document.getElementById("sl").innerText=(price*1.01).toFixed(2);
}
else{
document.getElementById("tp").innerText="--";
document.getElementById("sl").innerText="--";
}

document.getElementById("rsi").innerText=r.toFixed(2);
}

async function update(){

let data=await getData();
let price=data[data.length-1];
let r=rsi(data);
let sig=signal(r);

ui(sig,price,r);

}

setInterval(update,10000);

</script>

</body>
</html>
