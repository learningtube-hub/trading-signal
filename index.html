<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Trading Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: #111827;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 20px;
    }

    .menu-item {
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      background: #1f2937;
    }

    .menu-item:hover {
      background: #334155;
    }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Topbar */
    .topbar {
      height: 60px;
      background: #111827;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .search {
      background: #1f2937;
      padding: 8px 12px;
      border-radius: 8px;
      width: 300px;
      border: none;
      color: white;
    }

    .btn {
      background: #38bdf8;
      padding: 8px 12px;
      border-radius: 8px;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    /* Content */
    .content {
      display: flex;
      flex: 1;
      padding: 20px;
      gap: 20px;
      overflow: hidden;
    }

    .chart-box {
      flex: 2;
      background: #111827;
      padding: 20px;
      border-radius: 12px;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background: #111827;
      padding: 15px;
      border-radius: 12px;
    }

    .signal-buy {
      color: #22c55e;
      font-weight: bold;
    }

    .signal-sell {
      color: #ef4444;
      font-weight: bold;
    }

    .market-item {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">TRADE PRO</div>
    <div class="menu-item">Dashboard</div>
    <div class="menu-item">Market</div>
    <div class="menu-item">Signals</div>
    <div class="menu-item">Charts</div>
    <div class="menu-item">Upgrade</div>
    <div class="menu-item">Profile</div>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Topbar -->
    <div class="topbar">
      <input class="search" placeholder="Search coin..." />
      <div class="btn">Upgrade Pro</div>
    </div>

    <!-- Content -->
    <div class="content">

      <!-- Chart -->
      <div class="chart-box">
        <h3>BTC / USDT Live Chart</h3>
        <canvas id="chart"></canvas>
      </div>

      <!-- Right Panel -->
      <div class="panel">

        <div class="card">
          <h4>Signals</h4>
          <p class="signal-buy">BUY BTC +12%</p>
          <p class="signal-sell">SELL ETH -4%</p>
          <p class="signal-buy">BUY SOL +7%</p>
        </div>

        <div class="card">
          <h4>Market</h4>
          <div class="market-item"><span>BTC</span><span>$68,000</span></div>
          <div class="market-item"><span>ETH</span><span>$3,500</span></div>
          <div class="market-item"><span>SOL</span><span>$140</span></div>
        </div>

        <div class="card">
          <h4>Upgrade</h4>
          <p>Unlock Pro signals & AI tools</p>
          <button class="btn">Go Pro</button>
        </div>

      </div>
    </div>
  </div>

  <script>
    const ctx = document.getElementById('chart');

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
        datasets: [{
          label: 'BTC Price',
          data: [65000, 66000, 64000, 67000, 69000, 68000, 70000],
          borderColor: '#38bdf8',
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { labels: { color: 'white' } }
        },
        scales: {
          x: { ticks: { color: 'white' } },
          y: { ticks: { color: 'white' } }
        }
      }
    });
  </script>

</body>
</html>
